<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>audiocrawler</title>
<style>
  :root{
    --fg:#111; --bg:#fff; --line:#111; --soft:#d9d9d9;
    --muted:#767676; --accent:#ff3b00; --hover:#f1f1f1;
  }
  *{ box-sizing:border-box; border-radius:0 !important; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg); color:var(--fg);
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    padding-bottom:64px;
  }
  header{ display:flex; align-items:baseline; gap:16px; padding:14px 16px; border-bottom:2px solid var(--line); }
  header h1{ margin:0; font-size:15px; letter-spacing:3px; text-transform:uppercase; font-weight:700; }
  header .note{ color:var(--muted); font-size:12px; }

  form{ display:flex; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  form input{
    flex:1 1 180px; min-width:0; border:0; border-right:1px solid var(--soft);
    padding:10px 12px; font:inherit; color:inherit; background:transparent; outline:none;
  }
  form input:focus{ background:#fafafa; box-shadow:inset 0 -2px 0 var(--accent); }
  form input[type=number]{ flex:0 0 90px; text-align:center; }
  form button{
    border:0; border-left:1px solid var(--line); background:var(--fg); color:#fff;
    padding:10px 20px; font:inherit; letter-spacing:2px; text-transform:uppercase;
    cursor:pointer;
  }
  form button:hover:not(:disabled){ background:var(--accent); }
  form button:disabled{ background:#bbb; cursor:not-allowed; }
  form button#stop{ background:#fff; color:var(--fg); }
  form button#stop:hover:not(:disabled){ background:var(--accent); color:#fff; }
  form button#continue{ background:#fff; color:var(--fg); }
  form button#continue:hover:not(:disabled){ background:var(--accent); color:#fff; }
  form button#continue:disabled{ background:#fff; color:#bbb; cursor:not-allowed; }

  #bar{ display:flex; align-items:center; gap:12px; padding:8px 16px; border-bottom:1px solid var(--soft); }
  #status{ color:var(--muted); flex:1; }
  #filter{
    border:1px solid var(--soft); padding:5px 8px; font:inherit; color:inherit;
    background:transparent; outline:none; width:220px;
  }
  #filter:focus{ border-color:var(--line); }

  #tabs{ display:flex; border-bottom:1px solid var(--line); background:#fff; }
  #tabs button{
    flex:0 0 auto;
    border:0; border-right:1px solid var(--soft);
    border-bottom:2px solid transparent;
    background:transparent; color:var(--muted);
    font:inherit; font-size:11px; letter-spacing:2px; text-transform:uppercase;
    padding:10px 18px; cursor:pointer;
  }
  #tabs button:hover{ background:var(--hover); color:var(--fg); }
  #tabs button.active{ color:var(--fg); border-bottom-color:var(--accent); font-weight:700; }

  .panel{ display:none; }
  .panel.active{ display:block; }

  table{ width:100%; border-collapse:collapse; }
  th,td{ text-align:left; padding:6px 12px; border-bottom:1px solid #eee; vertical-align:top; }
  th{
    font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted);
    font-weight:400; border-bottom:1px solid var(--line); background:#fff;
  }
  tbody tr:hover{ background:var(--hover); }
  tbody tr.playing{ background:#fff2ee; box-shadow:inset 3px 0 0 var(--accent); }
  .trunc{ max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  td.host{ color:var(--accent); white-space:nowrap; }
  td.name{ font-weight:700; }
  td.page{ color:var(--muted); }
  td.act{ white-space:nowrap; text-align:right; }
  button.mini{
    border:1px solid var(--line); background:#fff; color:var(--fg);
    font:inherit; font-size:11px; letter-spacing:1px; padding:3px 9px;
    cursor:pointer; margin-left:6px;
  }
  button.mini:hover{ background:var(--fg); color:#fff; }
  button.mini.alt:hover{ background:var(--accent); border-color:var(--accent); color:#fff; }

  #logs{
    padding:10px 16px;
    font-size:12px;
    line-height:1.55;
    height:calc(100dvh - 240px);
    min-height:300px;
    overflow-y:auto;
    background:#fafafa;
    border-bottom:1px solid var(--soft);
  }
  .log{ padding:2px 0; white-space:pre-wrap; word-break:break-word; }
  .log-ok    { color:#0a7a3a; }
  .log-fail  { color:#b3261e; }
  .log-file  { color:var(--fg); }
  .log-info  { color:var(--muted); }
  .log-time  { color:#aaa; margin-right:8px; }

  /* ---------------- map ---------------- */
  #panel-map{ padding:16px; }
  #map-wrap{ position:relative; }
  #map{
    display:block;
    width:100%;
    height:calc(100dvh - 240px);
    min-height:400px;
    background:#fafafa;
    border:1px solid var(--soft);
    overflow:hidden;
    touch-action:none;
    cursor:grab;
    user-select:none;
    -webkit-user-select:none;
  }
  #map:active{ cursor:grabbing; }

  #map .node{ cursor:pointer; transition:opacity .15s ease; }
  #map .node text{ transition:opacity .15s ease; }
  #map .node.dim{ opacity:.16; }
  #map .node.dim text{ opacity:0; }
  #map .node:hover .dot{ stroke:var(--accent); }
  #map .node.selected .dot{ stroke:var(--accent); stroke-width:2.5; }

  #map .edge{ stroke:#d9d9d9; stroke-width:1; transition:opacity .15s ease, stroke .15s ease; }
  #map .edge.dim{ opacity:.1; }
  #map .edge.path{ stroke:var(--accent); stroke-width:1.4; }

  #node-popup{
    position:absolute; z-index:10;
    width:238px; max-height:280px;
    display:flex; flex-direction:column;
    background:#fff; border:1px solid var(--line);
    box-shadow:5px 5px 0 rgba(17,17,17,.13);
    font-size:11px; line-height:1.4;
  }
  #node-popup[hidden]{ display:none; }
  #node-popup .np-head{
    display:flex; align-items:center; gap:8px;
    padding:7px 9px; border-bottom:1px solid var(--soft);
  }
  #node-popup .np-dot{ width:7px; height:7px; background:var(--accent); flex:0 0 auto; }
  #node-popup .np-path{
    flex:1; min-width:0; font-weight:700; letter-spacing:.5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #node-popup .np-close{
    border:0; background:transparent; color:var(--muted);
    font:inherit; font-size:14px; line-height:1; padding:0 2px; cursor:pointer;
  }
  #node-popup .np-close:hover{ color:var(--accent); }
  #node-popup .np-meta{
    padding:5px 9px; color:var(--muted); border-bottom:1px solid #eee;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #node-popup .np-list{ overflow-y:auto; min-height:0; padding:3px 0; }
  #node-popup .np-empty{ padding:8px 9px; color:var(--muted); }
  #node-popup .np-file{ display:flex; align-items:center; gap:6px; padding:3px 9px; }
  #node-popup .np-file:hover{ background:var(--hover); }
  #node-popup .np-file span{
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  #player{
    position:fixed; left:0; right:0; bottom:0; display:flex; align-items:center; gap:12px;
    padding:10px 16px; background:#fff; border-top:2px solid var(--line);
  }
  #player[hidden]{ display:none; }
  #nowplaying{ flex:0 1 320px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #audio{ flex:1; height:32px; min-width:200px; }
  #closePlayer{
    border:1px solid var(--line); background:#fff; color:var(--fg);
    font:inherit; padding:4px 10px; cursor:pointer;
  }
  #closePlayer:hover{ background:var(--fg); color:#fff; }
  .empty{ padding:24px 16px; color:var(--muted); }
</style>
</head>
<body>

<header>
  <h1>audiocrawler</h1>
  <span class="note">crawl a site + its subdomains for audio files</span>
</header>

<form id="form">
  <input id="url" placeholder="https://example.com" required spellcheck="false" autocomplete="off">
  <input id="scope" placeholder="scope domain (auto)" spellcheck="false" autocomplete="off">
  <input id="pages" type="number" value="40" min="1" max="2000" title="max pages">
  <input id="depth" type="number" value="3" min="0" max="10" title="max depth">
  <button id="go" type="submit">crawl</button>
  <button id="stop" type="button" disabled>stop</button>
  <button id="continue" type="button" disabled>continue +1 worker</button>
</form>

<div id="bar">
  <span id="status">idle</span>
  <input id="filter" placeholder="filter…" spellcheck="false" autocomplete="off">
</div>

<nav id="tabs">
  <button type="button" data-tab="output" class="active">output</button>
  <button type="button" data-tab="logs">logs</button>
  <button type="button" data-tab="map">map</button>
</nav>

<section id="panel-output" class="panel active">
  <table>
    <thead>
      <tr><th>host</th><th>file</th><th>found on</th><th></th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</section>

<section id="panel-logs" class="panel">
  <div id="logs"></div>
</section>

<section id="panel-map" class="panel">
  <div id="map-wrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="node-popup" hidden></div>
  </div>
</section>

<footer id="player" hidden>
  <span id="nowplaying">—</span>
  <audio id="audio" controls preload="none"></audio>
  <button id="closePlayer" type="button">×</button>
</footer>

<script>
(function () {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const form = $('#form'), urlIn = $('#url'), scopeIn = $('#scope'),
        pagesIn = $('#pages'), depthIn = $('#depth'),
        goBtn = $('#go'), stopBtn = $('#stop'), continueBtn = $('#continue'),
        statusEl = $('#status'),
        tbody = $('#tbody'), player = $('#player'), audio = $('#audio'),
        nowPlaying = $('#nowplaying'), filterIn = $('#filter'),
        tabsNav = $('#tabs'), logsEl = $('#logs'), mapSvg = $('#map'),
        mapWrap = $('#map-wrap'), popupEl = $('#node-popup');

  const panels = {
    output: $('#panel-output'),
    logs:   $('#panel-logs'),
    map:    $('#panel-map')
  };

  let abortController = null;
  let finished = false, pageCount = 0, fileCount = 0, errCount = 0, rowCount = 0;

  let originUrl = '';
  const pageNodes = new Map();

  // Continue-with-new-worker state
  let pendingResume = null;
  let lockedParams = null;

  form.addEventListener('submit', function (e) { e.preventDefault(); begin(); });
  stopBtn.addEventListener('click', function () { stop('stopped'); });
  continueBtn.addEventListener('click', continueCrawl);
  filterIn.addEventListener('input', applyFilter);
  $('#closePlayer').addEventListener('click', function () {
    audio.pause(); audio.removeAttribute('src'); audio.load();
    player.hidden = true;
    document.querySelectorAll('tr.playing').forEach(function (r) { r.classList.remove('playing'); });
  });

  tabsNav.addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-tab]');
    if (!btn) return;
    const tab = btn.dataset.tab;
    tabsNav.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    Object.keys(panels).forEach(function (k) { panels[k].classList.toggle('active', k === tab); });
    if (tab === 'map') requestAnimationFrame(drawMap);
    if (tab === 'logs') logsEl.scrollTop = logsEl.scrollHeight;
  });

  const mapResizeObserver = new ResizeObserver(() => {
    if (panels.map.classList.contains('active')) drawMap();
  });
  mapResizeObserver.observe(mapSvg);

  function setStatus(t) { statusEl.textContent = t; }

  function addLog(kind, msg) {
    const line = document.createElement('div');
    line.className = 'log log-' + kind;
    const t = document.createElement('span');
    t.className = 'log-time';
    t.textContent = new Date().toLocaleTimeString();
    line.appendChild(t);
    line.appendChild(document.createTextNode(msg));
    logsEl.appendChild(line);
    const nearBottom = logsEl.scrollTop + logsEl.clientHeight >= logsEl.scrollHeight - 60;
    if (nearBottom) logsEl.scrollTop = logsEl.scrollHeight;
  }

  function begin() {
    // Full reset — new crawl from scratch
    stop('');
    pendingResume = null;
    lockedParams = null;
    finished = false; pageCount = 0; fileCount = 0; errCount = 0; rowCount = 0;
    tbody.textContent = '';
    logsEl.textContent = '';
    player.hidden = true;
    audio.pause(); audio.removeAttribute('src');

    pageNodes.clear();

    // reset map state
    selectedUrl = null;
    view.scale = 1; view.tx = 0; view.ty = 0;
    popupEl.hidden = true;

    continueBtn.disabled = true;
    continueBtn.textContent = 'continue +1 worker';

    if (panels.map.classList.contains('active')) requestAnimationFrame(drawMap);

    addLog('info', 'starting crawl: ' + urlIn.value.trim());
    startCrawl(null);
  }

  function continueCrawl() {
    if (!pendingResume) return;
    const resume = pendingResume;
    pendingResume = null;
    addLog('info', 'continuing with new worker (' + resume.queue.length + ' URLs queued)');
    startCrawl(resume);
  }

  function startCrawl(resume) {
    finished = false;

    if (!resume) {
      lockedParams = { url: urlIn.value.trim(), scope: scopeIn.value.trim() };
      originUrl = lockedParams.url;
    }

    const params = new URLSearchParams({
      url: lockedParams.url,
      scope: lockedParams.scope,
      maxPages: pagesIn.value,
      maxDepth: depthIn.value
    });

    setStatus(resume ? 'continuing…' : 'connecting…');
    goBtn.disabled = true;
    stopBtn.disabled = false;
    continueBtn.disabled = true;

    if (!resume) addLog('info', 'scope: ' + (lockedParams.scope || '(auto)'));

    abortController = new AbortController();
    runCrawl(params, abortController.signal, resume);
  }

  async function runCrawl(params, signal, resume) {
    try {
      let res;
      if (resume) {
        res = await fetch('/api/crawl?' + params.toString(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resume }),
          signal
        });
      } else {
        res = await fetch('/api/crawl?' + params.toString(), { signal });
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      if (!res.body) throw new Error('no response body');

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf('\n')) >= 0) {
          const line = buffer.slice(0, idx).trim();
          buffer = buffer.slice(idx + 1);
          if (line) onMessage(line);
        }
      }
      if (buffer.trim()) onMessage(buffer.trim());
    } catch (err) {
      if (err.name !== 'AbortError') {
        stop('connection lost');
        addLog('fail', 'connection lost: ' + String(err.message || err));
        return;
      }
    }
    stop('');
    if (!finished) {
      setStatus('stream ended');
      addLog('info', 'stream ended without done event');
    }
  }

  function stop(msg) {
    if (abortController) { abortController.abort(); abortController = null; }
    goBtn.disabled = false;
    stopBtn.disabled = true;
    if (msg) setStatus(msg);
  }

  function onMessage(line) {
    let m;
    try { m = JSON.parse(line); } catch (_) { return; }

    if (m.type === 'page') {
      pageCount++;
      if (m.status === 'ok') {
        addLog('ok', 'ok    ' + m.url + (m.links != null ? '   (' + m.links + ' links)' : ''));
        try {
          const u = new URL(m.url);
          pageNodes.set(m.url, {
            url: m.url,
            path: u.pathname,
            host: u.hostname,
            depth: m.depth || 0,
            source: m.source,
            files: []
          });
        } catch (_) {}
        if (panels.map.classList.contains('active')) requestAnimationFrame(drawMap);
      } else {
        errCount++;
        addLog('fail', 'fail  ' + m.url + '   — ' + (m.reason || 'unknown'));
      }
      setStatus('scanning — ' + pageCount + ' pages · ' + fileCount + ' files');
    } else if (m.type === 'file') {
      if (pageNodes.has(m.file.page)) {
        pageNodes.get(m.file.page).files.push(m.file);
        if (panels.map.classList.contains('active')) requestAnimationFrame(drawMap);
      }
      addRow(m.file);
      addLog('file', 'file  ' + m.file.host + ' / ' + m.file.name + '   ← ' + m.file.page);
    } else if (m.type === 'host') {
      addLog('info', 'host  ' + m.host);
    } else if (m.type === 'error') {
      errCount++;
      addLog('fail', 'error — ' + (m.message || 'unknown'));
    } else if (m.type === 'done') {
      finished = true;
      const s = m.stats || { pages: pageCount, files: fileCount, failed: errCount };
      setStatus('done — ' + s.pages + ' pages · ' + s.files + ' files · ' + s.failed + ' errors');
      addLog('info', 'done  — ' + s.pages + ' pages · ' + s.files + ' files · ' + s.failed + ' errors');
      stop('');

      if (m.resume && m.resume.queue && m.resume.queue.length > 0) {
        pendingResume = m.resume;
        continueBtn.disabled = false;
        continueBtn.textContent = 'continue +1 worker (' + m.resume.queue.length + ' queued)';
        addLog('info', m.resume.queue.length + ' URLs still queued — click continue to spin up a new worker');
      } else {
        pendingResume = null;
        continueBtn.disabled = true;
        continueBtn.textContent = 'continue +1 worker';
        addLog('info', 'crawl complete — queue empty');
      }

      if (s.files === 0 && !tbody.querySelector('td.empty')) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 4; td.className = 'empty';
        td.textContent = 'no audio files found (try raising depth / max pages, or set a scope domain)';
        tr.appendChild(td); tbody.appendChild(tr);
      }
    }
  }

  function addRow(f) {
    // Remove the "no audio files found" placeholder if files now exist
    const emptyTd = tbody.querySelector('td.empty');
    if (emptyTd) {
      const emptyRow = emptyTd.closest('tr');
      if (emptyRow) emptyRow.remove();
    }

    fileCount++;
    rowCount++;
    const tr = document.createElement('tr');

    const tdHost = document.createElement('td');
    tdHost.className = 'host';
    tdHost.textContent = f.host;

    const tdName = document.createElement('td');
    tdName.className = 'name trunc';
    tdName.textContent = f.name;
    tdName.title = f.url;

    const tdPage = document.createElement('td');
    tdPage.className = 'page trunc';
    tdPage.textContent = f.page;
    tdPage.title = f.page;

    const tdAct = document.createElement('td');
    tdAct.className = 'act';

    const playBtn = document.createElement('button');
    playBtn.type = 'button'; playBtn.className = 'mini'; playBtn.textContent = 'play';
    playBtn.addEventListener('click', function () { playFile(f, tr); });

    const dlBtn = document.createElement('button');
    dlBtn.type = 'button'; dlBtn.className = 'mini alt'; dlBtn.textContent = 'download';
    dlBtn.addEventListener('click', function () { downloadFile(f); });

    tdAct.appendChild(playBtn);
    tdAct.appendChild(dlBtn);

    tr.appendChild(tdHost);
    tr.appendChild(tdName);
    tr.appendChild(tdPage);
    tr.appendChild(tdAct);
    tr.dataset.search = (f.host + ' ' + f.name + ' ' + f.url + ' ' + f.page).toLowerCase();

    tbody.appendChild(tr);
    applyFilterTo(tr);
    setStatus('scanning — ' + pageCount + ' pages · ' + fileCount + ' files');
  }

  function playFile(f, tr) {
    document.querySelectorAll('tr.playing').forEach(function (r) { r.classList.remove('playing'); });
    if (tr) tr.classList.add('playing');
    player.hidden = false;
    nowPlaying.textContent = f.host + ' / ' + f.name;
    nowPlaying.title = f.url;
    audio.src = '/api/file?url=' + encodeURIComponent(f.url);
    const p = audio.play();
    if (p && p.catch) p.catch(function () { /* autoplay blocked or codec issue */ });
  }

  function downloadFile(f) {
    const a = document.createElement('a');
    a.href = '/api/file?dl=1&url=' + encodeURIComponent(f.url);
    a.download = f.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function applyFilter() {
    document.querySelectorAll('#tbody tr').forEach(applyFilterTo);
  }

  function applyFilterTo(tr) {
    const q = filterIn.value.trim().toLowerCase();
    if (!q || !tr.dataset.search) { tr.style.display = ''; return; }
    tr.style.display = tr.dataset.search.indexOf(q) === -1 ? 'none' : '';
  }

  // ---------------- map (force-directed graph, pan/zoom, node focus) ----------------

  const view = { scale: 1, tx: 0, ty: 0 };
  let selectedUrl = null;
  let viewportEl = null;

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function toLocal(clientX, clientY) {
    const r = mapSvg.getBoundingClientRect();
    const b = mapSvg.clientLeft || 0;
    return { x: clientX - r.left - b, y: clientY - r.top - b };
  }

  function applyTransform() {
    if (viewportEl) {
      viewportEl.setAttribute('transform',
        'translate(' + view.tx + ',' + view.ty + ') scale(' + view.scale + ')');
    }
    positionPopup();
  }

  function selectNode(url) {
    selectedUrl = (url && pageNodes.has(url)) ? url : null;
    updateHighlight();
    if (selectedUrl) showPopup(pageNodes.get(selectedUrl));
    else popupEl.hidden = true;
  }

  function updateHighlight() {
    if (!viewportEl) return;
    const pathUrls = new Set();
    if (selectedUrl) {
      let cur = pageNodes.get(selectedUrl), guard = 0;
      while (cur && guard++ < 5000) {
        pathUrls.add(cur.url);
        cur = cur.source ? pageNodes.get(cur.source) : null;
      }
    }
    const active = pathUrls.size > 0;

    viewportEl.querySelectorAll('.node').forEach(function (el) {
      const url = el.getAttribute('data-url');
      el.classList.toggle('dim', active && !pathUrls.has(url));
      el.classList.toggle('selected', url === selectedUrl);
    });

    viewportEl.querySelectorAll('.edge').forEach(function (el) {
      const inPath = active && pathUrls.has(el.getAttribute('data-target'));
      el.classList.toggle('dim', active && !inPath);
      el.classList.toggle('path', inPath);
    });
  }

  function showPopup(node) {
    if (!node) { popupEl.hidden = true; return; }
    popupEl.textContent = '';

    const head = document.createElement('div');
    head.className = 'np-head';

    const dot = document.createElement('span');
    dot.className = 'np-dot';

    const pathEl = document.createElement('span');
    pathEl.className = 'np-path';
    pathEl.textContent = node.path === '/' ? 'ORIGIN' : node.path;
    pathEl.title = node.url;

    const close = document.createElement('button');
    close.type = 'button';
    close.className = 'np-close';
    close.textContent = '×';
    close.title = 'clear selection';
    close.addEventListener('click', function () { selectNode(null); });

    head.appendChild(dot);
    head.appendChild(pathEl);
    head.appendChild(close);
    popupEl.appendChild(head);

    const meta = document.createElement('div');
    meta.className = 'np-meta';
    const n = node.files.length;
    meta.textContent = node.host + ' · ' + (n ? n + ' audio file' + (n > 1 ? 's' : '') : 'no audio files');
    meta.title = node.url;
    popupEl.appendChild(meta);

    const list = document.createElement('div');
    list.className = 'np-list';

    if (!n) {
      const empty = document.createElement('div');
      empty.className = 'np-empty';
      empty.textContent = 'no audio files on this page';
      list.appendChild(empty);
    } else {
      node.files.forEach(function (f) {
        const row = document.createElement('div');
        row.className = 'np-file';

        const name = document.createElement('span');
        name.textContent = f.name;
        name.title = f.url;

        const play = document.createElement('button');
        play.type = 'button';
        play.className = 'mini';
        play.textContent = 'play';
        play.addEventListener('click', function () { playFile(f, null); });

        row.appendChild(name);
        row.appendChild(play);
        list.appendChild(row);
      });
    }

    popupEl.appendChild(list);
    popupEl.hidden = false;
    positionPopup();
  }

  function positionPopup() {
    if (popupEl.hidden || !selectedUrl) return;
    const node = pageNodes.get(selectedUrl);
    if (!node || node.x === undefined) return;

    const b = mapSvg.clientLeft || 0;
    const sx = b + node.x * view.scale + view.tx;
    const sy = b + node.y * view.scale + view.ty;

    const W = mapWrap.clientWidth, H = mapWrap.clientHeight;
    const pw = popupEl.offsetWidth, ph = popupEl.offsetHeight;

    let left = sx + 14;
    if (left + pw > W - 6) left = sx - pw - 14;
    left = Math.max(6, Math.min(left, W - pw - 6));

    let top = sy - ph / 2;
    top = Math.max(6, Math.min(top, H - ph - 6));

    popupEl.style.left = left + 'px';
    popupEl.style.top = top + 'px';
  }

  // -------- pan / zoom / pinch --------

  const pointers = new Map();
  let drag = null, pinch = null;

  mapSvg.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    if (!mapSvg.setPointerCapture) return;
    mapSvg.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 1) {
      const nodeEl = e.target.closest ? e.target.closest('.node') : null;
      drag = {
        x: e.clientX, y: e.clientY,
        tx: view.tx, ty: view.ty,
        moved: false,
        url: nodeEl ? nodeEl.getAttribute('data-url') : null
      };
      pinch = null;
    } else if (pointers.size === 2) {
      const pts = Array.from(pointers.values());
      const a = toLocal(pts[0].x, pts[0].y);
      const b = toLocal(pts[1].x, pts[1].y);
      const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      pinch = {
        dist: dist,
        scale: view.scale,
        wx: (cx - view.tx) / view.scale,
        wy: (cy - view.ty) / view.scale
      };
      drag = null;
    }
  });

  mapSvg.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const pts = Array.from(pointers.values());

    if (pinch && pts.length >= 2) {
      const a = toLocal(pts[0].x, pts[0].y);
      const b = toLocal(pts[1].x, pts[1].y);
      const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      const k = clamp(pinch.scale * (dist / pinch.dist), 0.25, 6);
      view.scale = k;
      view.tx = cx - pinch.wx * k;
      view.ty = cy - pinch.wy * k;
      applyTransform();
      return;
    }

    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) > 4) drag.moved = true;
      if (drag.moved) {
        view.tx = drag.tx + dx;
        view.ty = drag.ty + dy;
        applyTransform();
      }
    }
  });

  function endPointer(e, cancelled) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    try { mapSvg.releasePointerCapture(e.pointerId); } catch (_) {}

    if (pointers.size < 2) pinch = null;

    if (pointers.size === 1) {
      const p = Array.from(pointers.values())[0];
      drag = { x: p.x, y: p.y, tx: view.tx, ty: view.ty, moved: true, url: null };
      return;
    }

    if (pointers.size === 0) {
      if (drag && !drag.moved && !cancelled) selectNode(drag.url);
      drag = null;
    }
  }

  mapSvg.addEventListener('pointerup', function (e) { endPointer(e, false); });
  mapSvg.addEventListener('pointercancel', function (e) { endPointer(e, true); });

  mapSvg.addEventListener('wheel', function (e) {
    e.preventDefault();
    const p = toLocal(e.clientX, e.clientY);
    const factor = Math.exp(-e.deltaY * 0.0015);
    const k = clamp(view.scale * factor, 0.25, 6);
    view.tx = p.x - (p.x - view.tx) * (k / view.scale);
    view.ty = p.y - (p.y - view.ty) * (k / view.scale);
    view.scale = k;
    applyTransform();
  }, { passive: false });

  // -------- drawing --------

  function drawMap() {
    const rect = mapSvg.getBoundingClientRect();
    if (rect.width === 0) return;
    const W = rect.width, H = rect.height;
    mapSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    mapSvg.innerHTML = '';
    viewportEl = null;

    const NS = 'http://www.w3.org/2000/svg';
    function make(name, attrs) {
      const el = document.createElementNS(NS, name);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    }

    const nodes = Array.from(pageNodes.values());
    if (nodes.length === 0) {
      const t = make('text', {
        x: W / 2, y: H / 2, 'text-anchor': 'middle',
        'font-family': 'ui-monospace, monospace', 'font-size': 12, fill: '#767676'
      });
      t.textContent = 'start a crawl to see the map';
      mapSvg.appendChild(t);
      selectedUrl = null;
      popupEl.hidden = true;
      return;
    }

    const cx = W / 2, cy = H / 2;
    const maxDepth = Math.max(...nodes.map(n => n.depth), 0);

    // 1. Initial radial layout (only applies to newly added nodes)
    const rings = Array.from({ length: maxDepth + 1 }, () => []);
    nodes.forEach(n => rings[n.depth].push(n));
    rings.forEach(ring => ring.sort((a, b) => (a.source || '').localeCompare(b.source || '')));

    rings.forEach((ring, depth) => {
      const n = ring.length;
      const r = (Math.min(W, H) / 2.5) * (depth / (maxDepth || 1));
      ring.forEach((node, i) => {
        if (node.x === undefined) {
          if (depth === 0) {
            node.x = cx;
            node.y = cy;
          } else {
            const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
            node.x = cx + Math.cos(angle) * r;
            node.y = cy + Math.sin(angle) * r;
          }
          node.vx = 0;
          node.vy = 0;
        }
      });
    });

    // 2. Force simulation to resolve overlaps
    const iterations = 100;
    const k = Math.sqrt((W * H) / Math.max(nodes.length, 1)) * 0.8;

    const nodeMap = new Map(nodes.map(n => [n.url, n]));
    const validEdges = [];
    nodes.forEach(node => {
      if (node.source && nodeMap.has(node.source)) {
        validEdges.push({ source: nodeMap.get(node.source), target: node });
      }
    });

    for (let iter = 0; iter < iterations; iter++) {
      // Repulsion
      for (let j = 0; j < nodes.length; j++) {
        const n1 = nodes[j];
        for (let l = j + 1; l < nodes.length; l++) {
          const n2 = nodes[l];
          let dx = n2.x - n1.x;
          let dy = n2.y - n1.y;
          let distSq = dx * dx + dy * dy;
          if (distSq < 1) distSq = 1;

          if (distSq < (k * 2) ** 2) {
            let dist = Math.sqrt(distSq);
            let force = (k * k) / distSq;

            if (n1.depth === 0) {
              n2.vx += (dx / dist) * force * 2;
              n2.vy += (dy / dist) * force * 2;
            } else if (n2.depth === 0) {
              n1.vx -= (dx / dist) * force * 2;
              n1.vy -= (dy / dist) * force * 2;
            } else {
              n1.vx -= (dx / dist) * force;
              n1.vy -= (dy / dist) * force;
              n2.vx += (dx / dist) * force;
              n2.vy += (dy / dist) * force;
            }
          }
        }
      }

      // Spring attraction
      validEdges.forEach(e => {
        let dx = e.target.x - e.source.x;
        let dy = e.target.y - e.source.y;
        let dist = Math.sqrt(dx * dx + dy * dy) || 1;
        let force = (dist - k) * 0.05;
        let fx = (dx / dist) * force;
        let fy = (dy / dist) * force;

        if (e.source.depth !== 0) { e.source.vx += fx; e.source.vy += fy; }
        if (e.target.depth !== 0) { e.target.vx -= fx; e.target.vy -= fy; }
      });

      // Gravity towards center
      nodes.forEach(n => {
        if (n.depth === 0) return;
        let dx = cx - n.x;
        let dy = cy - n.y;
        n.vx += dx * 0.02;
        n.vy += dy * 0.02;
      });

      // Update positions
      nodes.forEach(n => {
        if (n.depth === 0) return;

        n.vx *= 0.5;
        n.vy *= 0.5;
        n.x += n.vx;
        n.y += n.vy;

        const pad = 50;
        n.x = Math.max(pad, Math.min(W - pad, n.x));
        n.y = Math.max(pad, Math.min(H - pad, n.y));
      });
    }

    // viewport group (everything inside it pans / zooms)
    viewportEl = make('g', {});
    mapSvg.appendChild(viewportEl);

    // Edges
    validEdges.forEach(e => {
      viewportEl.appendChild(make('line', {
        x1: e.source.x, y1: e.source.y, x2: e.target.x, y2: e.target.y,
        'class': 'edge',
        'data-source': e.source.url,
        'data-target': e.target.url
      }));
    });

    // Nodes
    nodes.forEach(node => {
      const isRoot = node.depth === 0;
      const fc = node.files.length;
      const hasFiles = fc > 0;

      // radii halved for a cleaner look
      const r = isRoot ? 6 : (hasFiles ? 3.5 : 2.25);
      const fill = isRoot ? '#ff3b00' : (hasFiles ? '#fff2ee' : '#fff');
      const stroke = isRoot ? 'none' : (hasFiles ? '#ff3b00' : '#111');
      const strokeW = isRoot ? 0 : (hasFiles ? 1.5 : 1);

      const g = make('g', { 'class': 'node', 'data-url': node.url });

      // invisible hit area so tiny nodes are still easy to click
      g.appendChild(make('circle', {
        cx: node.x, cy: node.y, r: Math.max(10, r * 2.5), fill: 'transparent'
      }));

      g.appendChild(make('circle', {
        'class': 'dot', cx: node.x, cy: node.y, r: r,
        fill: fill, stroke: stroke, 'stroke-width': strokeW
      }));

      let label = node.path;
      if (label === '/') label = isRoot ? 'ORIGIN' : '/ (Home)';
      if (label.length > 16) label = label.substring(0, 14) + '...';

      const dx = node.x - cx;
      const dy = node.y - cy;
      const distFromCenter = Math.sqrt(dx * dx + dy * dy);

      let textX = node.x;
      let textY = node.y + (isRoot ? 18 : 12);
      let textAnchor = 'middle';

      if (!isRoot && distFromCenter > 20) {
        if (Math.abs(dy) > Math.abs(dx)) {
          if (dy > 0) { textY = node.y + 13; }
          else { textY = node.y - 8; }
        } else {
          if (dx > 0) { textX = node.x + 9; textAnchor = 'start'; textY = node.y + 3; }
          else { textX = node.x - 9; textAnchor = 'end'; textY = node.y + 3; }
        }
      }

      const title = make('title');
      title.textContent = node.url + (hasFiles ? ' (' + fc + ' audio file' + (fc > 1 ? 's' : '') + ')' : '');
      g.appendChild(title);

      const text = make('text', {
        x: textX, y: textY, 'text-anchor': textAnchor,
        'font-family': 'ui-monospace, monospace',
        'font-size': isRoot ? 11 : 9,
        'font-weight': isRoot ? 700 : 400,
        fill: isRoot ? '#111' : (hasFiles ? '#b3261e' : '#767676')
      });
      text.textContent = label;
      g.appendChild(text);

      viewportEl.appendChild(g);
    });

    // Legend (fixed — outside the zoomable viewport)
    const legend = make('g', { transform: 'translate(16, 16)' });

    legend.appendChild(make('circle', { cx: 6, cy: 6, r: 5, fill: '#ff3b00' }));
    const t1 = make('text', { x: 18, y: 10, 'font-family': 'ui-monospace, monospace', 'font-size': 11, fill: '#111' });
    t1.textContent = 'Start Page';
    legend.appendChild(t1);

    legend.appendChild(make('circle', { cx: 6, cy: 26, r: 3, fill: '#fff', stroke: '#111', 'stroke-width': 1 }));
    const t2 = make('text', { x: 18, y: 30, 'font-family': 'ui-monospace, monospace', 'font-size': 11, fill: '#111' });
    t2.textContent = 'Crawled Page';
    legend.appendChild(t2);

    legend.appendChild(make('circle', { cx: 6, cy: 46, r: 4.5, fill: '#fff2ee', stroke: '#ff3b00', 'stroke-width': 1.5 }));
    const t3 = make('text', { x: 18, y: 50, 'font-family': 'ui-monospace, monospace', 'font-size': 11, fill: '#b3261e' });
    t3.textContent = 'Page with Audio';
    legend.appendChild(t3);

    const hint = make('text', { x: 0, y: 76, 'font-family': 'ui-monospace, monospace', 'font-size': 10, fill: '#aaa' });
    hint.textContent = 'drag · scroll / pinch · click node';
    legend.appendChild(hint);

    mapSvg.appendChild(legend);

    applyTransform();
    updateHighlight();
    if (selectedUrl && pageNodes.has(selectedUrl)) showPopup(pageNodes.get(selectedUrl));
  }
})();
</script>
</body>
</html>
