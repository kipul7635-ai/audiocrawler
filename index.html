<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>audiocrawler</title>
<style>
  :root{
    --fg:#111; --bg:#fff; --line:#111; --soft:#d9d9d9;
    --muted:#767676; --accent:#ff3b00; --hover:#f1f1f1;
  }
  *{ box-sizing:border-box; border-radius:0 !important; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg); color:var(--fg);
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    padding-bottom:64px;
  }
  header{ display:flex; align-items:baseline; gap:16px; padding:14px 16px; border-bottom:2px solid var(--line); }
  header h1{ margin:0; font-size:15px; letter-spacing:3px; text-transform:uppercase; font-weight:700; }
  header .note{ color:var(--muted); font-size:12px; }

  form{ display:flex; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  form input{
    flex:1 1 180px; min-width:0; border:0; border-right:1px solid var(--soft);
    padding:10px 12px; font:inherit; color:inherit; background:transparent; outline:none;
  }
  form input:focus{ background:#fafafa; box-shadow:inset 0 -2px 0 var(--accent); }
  form input[type=number]{ flex:0 0 90px; text-align:center; }
  form button{
    border:0; border-left:1px solid var(--line); background:var(--fg); color:#fff;
    padding:10px 20px; font:inherit; letter-spacing:2px; text-transform:uppercase;
    cursor:pointer;
  }
  form button:hover:not(:disabled){ background:var(--accent); }
  form button:disabled{ background:#bbb; cursor:not-allowed; }
  form button#stop{ background:#fff; color:var(--fg); }
  form button#stop:hover:not(:disabled){ background:var(--accent); color:#fff; }

  #bar{ display:flex; align-items:center; gap:12px; padding:8px 16px; border-bottom:1px solid var(--soft); }
  #status{ color:var(--muted); flex:1; min-width:140px; }
  #filter{
    border:1px solid var(--soft); padding:5px 8px; font:inherit; color:inherit;
    background:transparent; outline:none; width:220px;
  }
  #filter:focus{ border-color:var(--line); }
  #bar button{
    border:1px solid var(--line); background:#fff; color:var(--fg);
    font:inherit; font-size:11px; letter-spacing:2px; text-transform:uppercase;
    padding:5px 10px; cursor:pointer;
  }
  #bar button:hover, #bar button.on{ background:var(--fg); color:#fff; }

  #mapPanel{ border-bottom:2px solid var(--line); background:#fafafa; }
  #mapPanel[hidden]{ display:none; }
  #mapHead{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 16px; border-bottom:1px solid var(--soft);
    font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted);
  }
  #mapHead button{
    border:1px solid var(--line); background:#fff; color:var(--fg);
    font:inherit; font-size:13px; line-height:1; padding:2px 8px; cursor:pointer;
  }
  #mapHead button:hover{ background:var(--fg); color:#fff; }
  #mapScroll{ overflow:auto; max-height:56vh; }
  #mapSvg{ display:block; }
  #mapSvg text{ font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; user-select:none; }
  #mapSvg .node{ cursor:pointer; }
  #mapSvg .node:not(.root):hover{ fill:#fff2ee; }

  table{ width:100%; border-collapse:collapse; }
  th,td{ text-align:left; padding:6px 12px; border-bottom:1px solid #eee; vertical-align:top; }
  th{
    font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted);
    font-weight:400; border-bottom:1px solid var(--line); background:#fff;
  }
  tbody tr:hover{ background:var(--hover); }
  tbody tr.playing{ background:#fff2ee; box-shadow:inset 3px 0 0 var(--accent); }
  .trunc{ max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  td.host{ color:var(--accent); white-space:nowrap; }
  td.name{ font-weight:700; }
  td.page{ color:var(--muted); }
  td.act{ white-space:nowrap; text-align:right; }
  button.mini{
    border:1px solid var(--line); background:#fff; color:var(--fg);
    font:inherit; font-size:11px; letter-spacing:1px; padding:3px 9px;
    cursor:pointer; margin-left:6px;
  }
  button.mini:hover{ background:var(--fg); color:#fff; }
  button.mini.alt:hover{ background:var(--accent); border-color:var(--accent); color:#fff; }

  #player{
    position:fixed; left:0; right:0; bottom:0; display:flex; align-items:center; gap:12px;
    padding:10px 16px; background:#fff; border-top:2px solid var(--line);
  }
  #player[hidden]{ display:none; }
  #nowplaying{ flex:0 1 320px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #audio{ flex:1; height:32px; min-width:200px; }
  #closePlayer{
    border:1px solid var(--line); background:#fff; color:var(--fg);
    font:inherit; padding:4px 10px; cursor:pointer;
  }
  #closePlayer:hover{ background:var(--fg); color:#fff; }
  .empty{ padding:24px 16px; color:var(--muted); }
</style>
</head>
<body>

<header>
  <h1>audiocrawler</h1>
  <span class="note">crawl a site + its subdomains for audio files</span>
</header>

<form id="form">
  <input id="url" placeholder="https://example.com" required spellcheck="false" autocomplete="off">
  <input id="scope" placeholder="scope domain (auto)" spellcheck="false" autocomplete="off">
  <input id="pages" type="number" value="100" min="1" max="2000" title="max pages">
  <input id="depth" type="number" value="3" min="0" max="10" title="max depth">
  <button id="go" type="submit">crawl</button>
  <button id="stop" type="button" disabled>stop</button>
</form>

<div id="bar">
  <span id="status">idle</span>
  <button id="mapBtn" type="button">map</button>
  <input id="filter" placeholder="filter…" spellcheck="false" autocomplete="off">
</div>

<div id="mapPanel" hidden>
  <div id="mapHead">
    <span>site map — click a node to filter the list</span>
    <button id="mapClose" type="button" aria-label="close map">×</button>
  </div>
  <div id="mapScroll">
    <svg id="mapSvg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>

<table>
  <thead>
    <tr><th>host</th><th>file</th><th>found on</th><th></th></tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<footer id="player" hidden>
  <span id="nowplaying">—</span>
  <audio id="audio" controls preload="none"></audio>
  <button id="closePlayer" type="button">×</button>
</footer>

<script>
(function () {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const $ = (s) => document.querySelector(s);
  const form = $('#form'), urlIn = $('#url'), scopeIn = $('#scope'),
        pagesIn = $('#pages'), depthIn = $('#depth'),
        goBtn = $('#go'), stopBtn = $('#stop'), statusEl = $('#status'),
        tbody = $('#tbody'), player = $('#player'), audio = $('#audio'),
        nowPlaying = $('#nowplaying'), filterIn = $('#filter'),
        mapBtn = $('#mapBtn'), mapPanel = $('#mapPanel'), mapClose = $('#mapClose'),
        mapSvg = $('#mapSvg');

  let es = null, finished = false, pageCount = 0, fileCount = 0, errCount = 0, rowCount = 0;

  /* ----- map state ----- */
  let mapOpen = false;
  let rootHost = '';
  let nodes = new Map();   // host -> file count
  let edges = new Map();   // child host -> parent host

  form.addEventListener('submit', function (e) { e.preventDefault(); begin(); });
  stopBtn.addEventListener('click', function () { stop('stopped'); });
  filterIn.addEventListener('input', applyFilter);
  mapBtn.addEventListener('click', toggleMap);
  mapClose.addEventListener('click', function () { toggleMap(false); });
  $('#closePlayer').addEventListener('click', function () {
    audio.pause(); audio.removeAttribute('src'); audio.load();
    player.hidden = true;
    document.querySelectorAll('tr.playing').forEach(function (r) { r.classList.remove('playing'); });
  });

  function setStatus(t) { statusEl.textContent = t; }

  /* ===== host helpers ===== */
  function hostOf(u) {
    if (!u) return '';
    u = String(u).trim();
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)) u = 'https://' + u;
    try { return new URL(u).hostname.toLowerCase(); } catch (e) { return ''; }
  }
  function stripWww(h) { return h.replace(/^www\./i, ''); }
  function isInScope(h) {
    if (!h || !rootHost) return false;
    return h === rootHost || h.endsWith('.' + rootHost);
  }

  /* ===== crawl ===== */
  function begin() {
    stop('');
    finished = false; pageCount = 0; fileCount = 0; errCount = 0; rowCount = 0;
    tbody.textContent = '';
    player.hidden = true;
    audio.pause(); audio.removeAttribute('src');

    // reset map
    nodes = new Map();
    edges = new Map();
    rootHost = hostOf(scopeIn.value) || stripWww(hostOf(urlIn.value)) || '';
    if (mapOpen) renderMap();

    const params = new URLSearchParams({
      url: urlIn.value.trim(),
      scope: scopeIn.value.trim(),
      maxPages: pagesIn.value,
      maxDepth: depthIn.value
    });

    setStatus('connecting…');
    goBtn.disabled = true;
    stopBtn.disabled = false;

    es = new EventSource('/api/crawl?' + params.toString());
    es.onmessage = onMessage;
    es.onerror = function () {
      if (finished || !es) return;
      stop('connection lost');
    };
  }

  function stop(msg) {
    if (es) { es.close(); es = null; }
    goBtn.disabled = false;
    stopBtn.disabled = true;
    if (msg) setStatus(msg);
  }

  function onMessage(ev) {
    let m;
    try { m = JSON.parse(ev.data); } catch (_) { return; }

    if (m.type === 'page') {
      pageCount++;
      setStatus('scanning — ' + pageCount + ' pages · ' + fileCount + ' files');
    } else if (m.type === 'file') {
      addRow(m.file);
      registerMap(m.file);
      if (mapOpen) renderMap();
    } else if (m.type === 'error') {
      errCount++;
    } else if (m.type === 'done') {
      finished = true;
      const s = m.stats || { pages: pageCount, files: fileCount, failed: errCount };
      setStatus('done — ' + s.pages + ' pages · ' + s.files + ' files · ' + s.failed + ' errors');
      stop('');
      if (mapOpen) renderMap();
      if (s.files === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 4; td.className = 'empty';
        td.textContent = 'no audio files found (try raising depth / max pages, or set a scope domain)';
        tr.appendChild(td); tbody.appendChild(tr);
      }
    }
  }

  /* ===== table ===== */
  function addRow(f) {
    fileCount++;
    rowCount++;
    const tr = document.createElement('tr');

    const tdHost = document.createElement('td');
    tdHost.className = 'host';
    tdHost.textContent = f.host;

    const tdName = document.createElement('td');
    tdName.className = 'name trunc';
    tdName.textContent = f.name;
    tdName.title = f.url;

    const tdPage = document.createElement('td');
    tdPage.className = 'page trunc';
    tdPage.textContent = f.page;
    tdPage.title = f.page;

    const tdAct = document.createElement('td');
    tdAct.className = 'act';

    const playBtn = document.createElement('button');
    playBtn.type = 'button'; playBtn.className = 'mini'; playBtn.textContent = 'play';
    playBtn.addEventListener('click', function () { playFile(f, tr); });

    const dlBtn = document.createElement('button');
    dlBtn.type = 'button'; dlBtn.className = 'mini alt'; dlBtn.textContent = 'download';
    dlBtn.addEventListener('click', function () { downloadFile(f); });

    tdAct.appendChild(playBtn);
    tdAct.appendChild(dlBtn);

    tr.appendChild(tdHost);
    tr.appendChild(tdName);
    tr.appendChild(tdPage);
    tr.appendChild(tdAct);
    tr.dataset.search = (f.host + ' ' + f.name + ' ' + f.url + ' ' + f.page).toLowerCase();

    tbody.appendChild(tr);
    applyFilterTo(tr);
    setStatus('scanning — ' + pageCount + ' pages · ' + fileCount + ' files');
  }

  function playFile(f, tr) {
    document.querySelectorAll('tr.playing').forEach(function (r) { r.classList.remove('playing'); });
    tr.classList.add('playing');
    player.hidden = false;
    nowPlaying.textContent = f.host + ' / ' + f.name;
    nowPlaying.title = f.url;
    audio.src = '/api/file?url=' + encodeURIComponent(f.url);
    const p = audio.play();
    if (p && p.catch) p.catch(function () { /* autoplay blocked or codec issue */ });
  }

  function downloadFile(f) {
    const a = document.createElement('a');
    a.href = '/api/file?dl=1&url=' + encodeURIComponent(f.url);
    a.download = f.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function applyFilter() {
    document.querySelectorAll('#tbody tr').forEach(applyFilterTo);
  }

  function applyFilterTo(tr) {
    const q = filterIn.value.trim().toLowerCase();
    if (!q || !tr.dataset.search) { tr.style.display = ''; return; }
    tr.style.display = tr.dataset.search.indexOf(q) === -1 ? 'none' : '';
  }

  /* ===== map: data collection ===== */
  function registerMap(f) {
    if (!f || !f.host) return;
    const h = String(f.host).toLowerCase();

    nodes.set(h, (nodes.get(h) || 0) + 1);

    if (!rootHost) rootHost = stripWww(h);
    if (h === rootHost) return;
    if (edges.has(h)) return;

    const pageHost = hostOf(f.page);

    if (pageHost && pageHost !== h && pageHost !== rootHost && isInScope(pageHost)) {
      // found on a page of another in-scope host → attach there
      if (!nodes.has(pageHost)) nodes.set(pageHost, 0);
      if (pageHost !== rootHost && !edges.has(pageHost)) edges.set(pageHost, rootHost);
      edges.set(h, pageHost);
    } else {
      edges.set(h, rootHost);
    }
  }

  /* ===== map: toggle ===== */
  function toggleMap(force) {
    mapOpen = (typeof force === 'boolean') ? force : !mapOpen;
    mapPanel.hidden = !mapOpen;
    mapBtn.classList.toggle('on', mapOpen);
    if (mapOpen) {
      if (!rootHost) {
        rootHost = hostOf(scopeIn.value) || stripWww(hostOf(urlIn.value)) || '';
      }
      renderMap();
    }
  }

  /* ===== map: render ===== */
  function renderMap() {
    while (mapSvg.firstChild) mapSvg.removeChild(mapSvg.firstChild);

    if (!rootHost) {
      placeholder('no data — run a crawl');
      return;
    }
    if (!nodes.has(rootHost)) nodes.set(rootHost, 0);

    // build children map
    const children = new Map();
    nodes.forEach(function (_, h) { children.set(h, []); });
    edges.forEach(function (parent, child) {
      if (!children.has(parent)) children.set(parent, []);
      if (!children.has(child)) children.set(child, []);
      children.get(parent).push(child);
    });

    // BFS into levels
    const levels = [];
    const visited = new Set([rootHost]);
    let cur = [rootHost];
    let guard = 0;
    while (cur.length && guard++ < 50) {
      levels.push(cur);
      const next = [];
      for (let i = 0; i < cur.length; i++) {
        const kids = children.get(cur[i]) || [];
        for (let j = 0; j < kids.length; j++) {
          const c = kids[j];
          if (!visited.has(c)) { visited.add(c); next.push(c); }
        }
      }
      cur = next;
    }

    // attach orphans (shouldn't normally happen)
    const orphans = [];
    nodes.forEach(function (_, h) { if (!visited.has(h)) orphans.push(h); });
    if (orphans.length) {
      if (levels.length < 2) levels.push(orphans);
      else levels[1] = levels[1].concat(orphans);
    }

    const NODE_H = 26, ROW_H = 78, PAD = 24, GAP = 22;

    const labelOf = function (h) { return h + '  ' + (nodes.get(h) || 0); };
    const widths = levels.map(function (row) {
      return row.map(function (h) { return Math.max(64, labelOf(h).length * 6.5 + 22); });
    });
    const rowW = widths.map(function (r) {
      return r.reduce(function (a, b) { return a + b; }, 0) + GAP * Math.max(0, r.length - 1);
    });

    const maxRow = rowW.length ? Math.max.apply(null, rowW) : 360;
    const W = Math.max(360, maxRow) + PAD * 2;
    const H = PAD * 2 + NODE_H + (levels.length - 1) * ROW_H;

    mapSvg.setAttribute('width', W);
    mapSvg.setAttribute('height', H);
    mapSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

    // positions
    const pos = new Map();
    levels.forEach(function (row, li) {
      let x = (W - rowW[li]) / 2;
      const y = PAD + li * ROW_H;
      row.forEach(function (h, i) {
        const w = widths[li][i];
        pos.set(h, { cx: x + w / 2, y: y, w: w });
        x += w + GAP;
      });
    });

    // edges (lines) first
    edges.forEach(function (parent, child) {
      const p = pos.get(parent), c = pos.get(child);
      if (!p || !c) return;
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', p.cx);
      line.setAttribute('y1', p.y + NODE_H);
      line.setAttribute('x2', c.cx);
      line.setAttribute('y2', c.y);
      line.setAttribute('stroke', '#111');
      line.setAttribute('stroke-width', '1');
      mapSvg.appendChild(line);
    });

    // nodes
    pos.forEach(function (p, h) {
      const isRoot = (h === rootHost);
      const g = document.createElementNS(NS, 'g');

      const rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('x', p.cx - p.w / 2);
      rect.setAttribute('y', p.y);
      rect.setAttribute('width', p.w);
      rect.setAttribute('height', NODE_H);
      rect.setAttribute('class', 'node' + (isRoot ? ' root' : ''));
      rect.setAttribute('fill', isRoot ? '#111' : '#fff');
      rect.setAttribute('stroke', '#111');
      rect.setAttribute('stroke-width', '1.5');

      const txt = document.createElementNS(NS, 'text');
      txt.setAttribute('x', p.cx);
      txt.setAttribute('y', p.y + NODE_H / 2 + 4);
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('fill', isRoot ? '#fff' : '#111');

      const s1 = document.createElementNS(NS, 'tspan');
      s1.textContent = h;

      const s2 = document.createElementNS(NS, 'tspan');
      s2.setAttribute('fill', isRoot ? '#888' : '#767676');
      s2.textContent = '  ' + (nodes.get(h) || 0);

      txt.appendChild(s1);
      txt.appendChild(s2);

      const title = document.createElementNS(NS, 'title');
      title.textContent = h + ' — ' + (nodes.get(h) || 0) + ' file(s) · click to filter';

      g.appendChild(rect);
      g.appendChild(txt);
      g.appendChild(title);

      g.addEventListener('click', function () {
        filterIn.value = h;
        applyFilter();
      });

      mapSvg.appendChild(g);
    });
  }

  function placeholder(msg) {
    const W = 420, H = 100;
    mapSvg.setAttribute('width', W);
    mapSvg.setAttribute('height', H);
    mapSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', W / 2);
    t.setAttribute('y', H / 2 + 4);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('fill', '#767676');
    t.textContent = msg;
    mapSvg.appendChild(t);
  }
})();
</script>
</body>
</html>
