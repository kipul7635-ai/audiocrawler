<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>audiocrawler</title>
<style>
  :root{
    --fg:#111; --bg:#fff; --line:#111; --soft:#d9d9d9;
    --muted:#767676; --accent:#ff3b00; --hover:#f1f1f1;
  }
  *{ box-sizing:border-box; border-radius:0 !important; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg); color:var(--fg);
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    padding-bottom:64px;
  }
  header{ display:flex; align-items:baseline; gap:16px; padding:14px 16px; border-bottom:2px solid var(--line); }
  header h1{ margin:0; font-size:15px; letter-spacing:3px; text-transform:uppercase; font-weight:700; }
  header .note{ color:var(--muted); font-size:12px; }

  form{ display:flex; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  form input{
    flex:1 1 180px; min-width:0; border:0; border-right:1px solid var(--soft);
    padding:10px 12px; font:inherit; color:inherit; background:transparent; outline:none;
  }
  form input:focus{ background:#fafafa; box-shadow:inset 0 -2px 0 var(--accent); }
  form input[type=number]{ flex:0 0 90px; text-align:center; }
  form button{
    border:0; border-left:1px solid var(--line); background:var(--fg); color:#fff;
    padding:10px 20px; font:inherit; letter-spacing:2px; text-transform:uppercase;
    cursor:pointer;
  }
  form button:hover:not(:disabled){ background:var(--accent); }
  form button:disabled{ background:#bbb; cursor:not-allowed; }
  form button#stop{ background:#fff; color:var(--fg); }
  form button#stop:hover:not(:disabled){ background:var(--accent); color:#fff; }
  form button#continue{ background:#fff; color:var(--fg); }
  form button#continue:hover:not(:disabled){ background:var(--accent); color:#fff; }
  form button#continue:disabled{ background:#fff; color:#bbb; cursor:not-allowed; }

  #bar{ display:flex; align-items:center; gap:12px; padding:8px 16px; border-bottom:1px solid var(--soft); }
  #status{ color:var(--muted); flex:1; }
  #filter{
    border:1px solid var(--soft); padding:5px 8px; font:inherit; color:inherit;
    background:transparent; outline:none; width:220px;
  }
  #filter:focus{ border-color:var(--line); }

  #tabs{ display:flex; border-bottom:1px solid var(--line); background:#fff; }
  #tabs button{
    flex:0 0 auto;
    border:0; border-right:1px solid var(--soft);
    border-bottom:2px solid transparent;
    background:transparent; color:var(--muted);
    font:inherit; font-size:11px; letter-spacing:2px; text-transform:uppercase;
    padding:10px 18px; cursor:pointer;
  }
  #tabs button:hover{ background:var(--hover); color:var(--fg); }
  #tabs button.active{ color:var(--fg); border-bottom-color:var(--accent); font-weight:700; }

  .panel{ display:none; }
  .panel.active{ display:block; }

  table{ width:100%; border-collapse:collapse; }
  th,td{ text-align:left; padding:6px 12px; border-bottom:1px solid #eee; vertical-align:top; }
  th{
    font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted);
    font-weight:400; border-bottom:1px solid var(--line); background:#fff;
  }
  tbody tr:hover{ background:var(--hover); }
  tbody tr.playing{ background:#fff2ee; box-shadow:inset 3px 0 0 var(--accent); }
  .trunc{ max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  td.host{ color:var(--accent); white-space:nowrap; }
  td.name{ font-weight:700; }
  td.page{ color:var(--muted); }
  td.act{ white-space:nowrap; text-align:right; }
  button.mini{
    border:1px solid var(--line); background:#fff; color:var(--fg);
    font:inherit; font-size:11px; letter-spacing:1px; padding:3px 9px;
    cursor:pointer; margin-left:6px;
  }
  button.mini:hover{ background:var(--fg); color:#fff; }
  button.mini.alt:hover{ background:var(--accent); border-color:var(--accent); color:#fff; }

  #logs{
    padding:10px 16px;
    font-size:12px;
    line-height:1.55;
    height:calc(100dvh - 240px);
    min-height:300px;
    overflow-y:auto;
    background:#fafafa;
    border-bottom:1px solid var(--soft);
  }
  .log{ padding:2px 0; white-space:pre-wrap; word-break:break-word; }
  .log-ok    { color:#0a7a3a; }
  .log-fail  { color:#b3261e; }
  .log-file  { color:var(--fg); }
  .log-info  { color:var(--muted); }
  .log-time  { color:#aaa; margin-right:8px; }

  #panel-map{ padding:0; position:relative; height:calc(100dvh - 240px); min-height:400px; overflow:hidden; background:#fafafa; border-bottom:1px solid var(--soft); }
  
  #map-wrapper{
    width:100%; height:100%; cursor:grab; touch-action:none;
    transition:transform 0.4s ease;
    transform-origin:center center;
  }
  #map-wrapper:active{ cursor:grabbing; }
  #map-wrapper.mode-3d{
    transform: perspective(1200px) rotateX(55deg) rotateZ(-45deg) scale(0.8);
  }
  
  #map{ display:block; width:100%; height:100%; }

  .node-text { pointer-events:none; transition: opacity 0.2s; }
  .edge { transition: opacity 0.2s, stroke 0.2s; }
  .node-circle { transition: opacity 0.2s, fill 0.2s, stroke 0.2s, r 0.2s; cursor:pointer; }
  
  .dimmed { opacity: 0.1 !important; }
  .highlighted { opacity: 1 !important; }
  .highlighted-edge { stroke: var(--accent) !important; stroke-width: 2px !important; }
  .selected-node { stroke: var(--accent) !important; stroke-width: 3px !important; }

  .map-btn {
    position:absolute; top:16px; right:16px;
    background:#fff; border:1px solid var(--line); color:var(--fg);
    font:inherit; font-size:11px; padding:6px 10px; letter-spacing:1px; text-transform:uppercase;
    cursor:pointer; z-index:10;
  }
  .map-btn:hover{ background:var(--fg); color:#fff; }
  .map-btn:active{ background:var(--accent); border-color:var(--accent); }
  #btn-reset{ right:100px; }

  #map-sidebar {
    position:absolute; top:0; right:0; bottom:0; width:320px;
    background:rgba(255, 255, 255, 0.95); backdrop-filter: blur(4px);
    border-left:1px solid var(--line); z-index:20;
    display:flex; flex-direction:column;
    transform:translateX(100%); transition:transform 0.3s ease;
  }
  #map-sidebar.open { transform:translateX(0); }
  .sidebar-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid var(--soft);
  }
  .sidebar-title { font-weight:700; font-size:12px; word-break:break-all; }
  .sidebar-close { border:none; background:none; font-size:18px; cursor:pointer; padding:0; color:var(--muted); }
  .sidebar-close:hover { color:var(--accent); }
  .sidebar-content { flex:1; overflow-y:auto; padding:12px 16px; }
  .file-item {
    padding:8px 0; border-bottom:1px solid #eee; display:flex; flex-direction:column; gap:4px;
  }
  .file-item:last-child { border-bottom:none; }
  .file-name { font-weight:700; font-size:12px; word-break:break-all; }
  .file-actions { display:flex; gap:6px; margin-top:4px; }
  .file-actions button {
    border:1px solid var(--line); background:#fff; padding:3px 8px; font:inherit; font-size:11px; cursor:pointer;
  }
  .file-actions button:hover { background:var(--accent); border-color:var(--accent); color:#fff; }

  #player{
    position:fixed; left:0; right:0; bottom:0; display:flex; align-items:center; gap:12px;
    padding:10px 16px; background:#fff; border-top:2px solid var(--line);
  }
  #player[hidden]{ display:none; }
  #nowplaying{ flex:0 1 320px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #audio{ flex:1; height:32px; min-width:200px; }
  #closePlayer{
    border:1px solid var(--line); background:#fff; color:var(--fg);
    font:inherit; padding:4px 10px; cursor:pointer;
  }
  #closePlayer:hover{ background:var(--fg); color:#fff; }
  .empty{ padding:24px 16px; color:var(--muted); }
</style>
</head>
<body>

<header>
  <h1>audiocrawler</h1>
  <span class="note">crawl a site + its subdomains for audio files</span>
</header>

<form id="form">
  <input id="url" placeholder="https://example.com" required spellcheck="false" autocomplete="off">
  <input id="scope" placeholder="scope domain (auto)" spellcheck="false" autocomplete="off">
  <input id="pages" type="number" value="40" min="1" max="2000" title="max pages">
  <input id="depth" type="number" value="3" min="0" max="10" title="max depth">
  <button id="go" type="submit">crawl</button>
  <button id="stop" type="button" disabled>stop</button>
  <button id="continue" type="button" disabled>continue +1 worker</button>
</form>

<div id="bar">
  <span id="status">idle</span>
  <input id="filter" placeholder="filter…" spellcheck="false" autocomplete="off">
</div>

<nav id="tabs">
  <button type="button" data-tab="output" class="active">output</button>
  <button type="button" data-tab="logs">logs</button>
  <button type="button" data-tab="map">map</button>
</nav>

<section id="panel-output" class="panel active">
  <table>
    <thead>
      <tr><th>host</th><th>file</th><th>found on</th><th></th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</section>

<section id="panel-logs" class="panel">
  <div id="logs"></div>
</section>

<section id="panel-map" class="panel">
  <div id="map-wrapper">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  
  <button id="btn-reset" class="map-btn" type="button">Reset View</button>
  <button id="btn-3d" class="map-btn" type="button">Toggle 3D</button>

  <div id="map-sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title" id="sidebar-title">Files</span>
      <button class="sidebar-close" id="sidebar-close" type="button">×</button>
    </div>
    <div class="sidebar-content" id="sidebar-files"></div>
  </div>
</section>

<footer id="player" hidden>
  <span id="nowplaying">—</span>
  <audio id="audio" controls preload="none"></audio>
  <button id="closePlayer" type="button">×</button>
</footer>

<script>
(function () {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const form = $('#form'), urlIn = $('#url'), scopeIn = $('#scope'),
        pagesIn = $('#pages'), depthIn = $('#depth'),
        goBtn = $('#go'), stopBtn = $('#stop'), continueBtn = $('#continue'), statusEl = $('#status'),
        tbody = $('#tbody'), player = $('#player'), audio = $('#audio'),
        nowPlaying = $('#nowplaying'), filterIn = $('#filter'),
        tabsNav = $('#tabs'), logsEl = $('#logs'), mapSvg = $('#map'),
        mapWrapper = $('#map-wrapper'), sidebar = $('#map-sidebar'),
        sidebarTitle = $('#sidebar-title'), sidebarFiles = $('#sidebar-files');

  const panels = {
    output: $('#panel-output'),
    logs:   $('#panel-logs'),
    map:    $('#panel-map')
  };

  let abortController = null;
  let finished = false, pageCount = 0, fileCount = 0, errCount = 0, rowCount = 0;

  let originUrl = '';
  let pageNodes = new Map();
  let selectedNodeUrl = null;

  // Continue-with-new-worker state
  let pendingResume = null;
  let lockedParams = null;

  // Map view state
  let viewState = { x: 0, y: 0, scale: 1 };
  let isDragging = false, startX = 0, startY = 0;
  let is3D = false;

  form.addEventListener('submit', function (e) { e.preventDefault(); begin(); });
  stopBtn.addEventListener('click', function () { stop('stopped'); });
  continueBtn.addEventListener('click', continueCrawl);
  filterIn.addEventListener('input', applyFilter);
  $('#closePlayer').addEventListener('click', function () {
    audio.pause(); audio.removeAttribute('src'); audio.load();
    player.hidden = true;
    document.querySelectorAll('tr.playing').forEach(function (r) { r.classList.remove('playing'); });
  });

  tabsNav.addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-tab]');
    if (!btn) return;
    const tab = btn.dataset.tab;
    tabsNav.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    Object.keys(panels).forEach(function (k) { panels[k].classList.toggle('active', k === tab); });
    if (tab === 'map') requestAnimationFrame(drawMap);
    if (tab === 'logs') logsEl.scrollTop = logsEl.scrollHeight;
  });

  // --- Map Interactions ---

  $('#sidebar-close').addEventListener('click', function() {
    sidebar.classList.remove('open');
    selectedNodeUrl = null;
    applyHighlights();
  });

  $('#btn-3d').addEventListener('click', function() {
    is3D = !is3D;
    mapWrapper.classList.toggle('mode-3d', is3D);
    this.textContent = is3D ? 'Toggle 2D' : 'Toggle 3D';
  });

  $('#btn-reset').addEventListener('click', function() {
    viewState = { x: 0, y: 0, scale: 1 };
    applyTransform();
  });

  function applyTransform() {
    const g = mapSvg.querySelector('#map-viewport');
    if (g) {
      g.setAttribute('transform', `translate(${viewState.x}, ${viewState.y}) scale(${viewState.scale})`);
    }
  }

  mapWrapper.addEventListener('wheel', function(e) {
    e.preventDefault();
    const zoomFactor = 1.1;
    if (e.deltaY < 0) viewState.scale *= zoomFactor;
    else viewState.scale /= zoomFactor;
    viewState.scale = Math.max(0.1, Math.min(10, viewState.scale));
    applyTransform();
  }, { passive: false });

  mapWrapper.addEventListener('pointerdown', function(e) {
    if (e.target.closest('circle') || e.target.closest('text')) return;
    isDragging = true;
    startX = e.clientX - viewState.x;
    startY = e.clientY - viewState.y;
    mapWrapper.setPointerCapture(e.pointerId);
  });

  mapWrapper.addEventListener('pointermove', function(e) {
    if (!isDragging) return;
    viewState.x = e.clientX - startX;
    viewState.y = e.clientY - startY;
    applyTransform();
  });

  mapWrapper.addEventListener('pointerup', function(e) {
    isDragging = false;
    mapWrapper.releasePointerCapture(e.pointerId);
  });

  // Touch Pinch
  let touchDist = 0;
  mapWrapper.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) {
      touchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });

  mapWrapper.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (touchDist > 0) {
        const factor = dist / touchDist;
        viewState.scale *= factor;
        viewState.scale = Math.max(0.1, Math.min(10, viewState.scale));
        applyTransform();
      }
      touchDist = dist;
    }
  }, { passive: false });

  mapWrapper.addEventListener('touchend', function(e) {
    if (e.touches.length < 2) touchDist = 0;
  }, { passive: true });

  // --- Core Logic ---

  const mapResizeObserver = new ResizeObserver(() => {
    if (panels.map.classList.contains('active')) drawMap();
  });
  mapResizeObserver.observe(mapSvg);

  function setStatus(t) { statusEl.textContent = t; }

  function addLog(kind, msg) {
    const line = document.createElement('div');
    line.className = 'log log-' + kind;
    const t = document.createElement('span');
    t.className = 'log-time';
    t.textContent = new Date().toLocaleTimeString();
    line.appendChild(t);
    line.appendChild(document.createTextNode(msg));
    logsEl.appendChild(line);
    const nearBottom = logsEl.scrollTop + logsEl.clientHeight >= logsEl.scrollHeight - 60;
    if (nearBottom) logsEl.scrollTop = logsEl.scrollHeight;
  }

  function begin() {
    stop('');
    pendingResume = null;
    lockedParams = null;
    finished = false; pageCount = 0; fileCount = 0; errCount = 0; rowCount = 0;
    tbody.textContent = '';
    logsEl.textContent = '';
    player.hidden = true;
    audio.pause(); audio.removeAttribute('src');
    sidebar.classList.remove('open');
    selectedNodeUrl = null;
    pageNodes.clear();
    viewState = { x: 0, y: 0, scale: 1 };
    if (panels.map.classList.contains('active')) requestAnimationFrame(drawMap);

    continueBtn.disabled = true;
    continueBtn.textContent = 'continue +1 worker';

    addLog('info', 'starting crawl: ' + urlIn.value.trim());
    startCrawl(null);
  }

  function continueCrawl() {
    if (!pendingResume) return;
    const resume = pendingResume;
    pendingResume = null;
    addLog('info', 'continuing with new worker (' + resume.queue.length + ' URLs queued)');
    startCrawl(resume);
  }

  function startCrawl(resume) {
    finished = false;
    if (!resume) {
      lockedParams = { url: urlIn.value.trim(), scope: scopeIn.value.trim() };
      originUrl = lockedParams.url;
    }

    const params = new URLSearchParams({
      url: lockedParams.url,
      scope: lockedParams.scope,
      maxPages: pagesIn.value,
      maxDepth: depthIn.value
    });

    setStatus(resume ? 'continuing…' : 'connecting…');
    goBtn.disabled = true;
    stopBtn.disabled = false;
    continueBtn.disabled = true;

    if (!resume) addLog('info', 'scope: ' + (lockedParams.scope || '(auto)'));

    abortController = new AbortController();
    runCrawl(params, abortController.signal, resume);
  }

  async function runCrawl(params, signal, resume) {
    try {
      let res;
      if (resume) {
        res = await fetch('/api/crawl?' + params.toString(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resume }),
          signal
        });
      } else {
        res = await fetch('/api/crawl?' + params.toString(), { signal });
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      if (!res.body) throw new Error('no response body');

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf('\n')) >= 0) {
          const line = buffer.slice(0, idx).trim();
          buffer = buffer.slice(idx + 1);
          if (line) onMessage(line);
        }
      }
      if (buffer.trim()) onMessage(buffer.trim());
    } catch (err) {
      if (err.name !== 'AbortError') {
        stop('connection lost');
        addLog('fail', 'connection lost: ' + String(err.message || err));
        return;
      }
    }
    stop('');
    if (!finished) {
      setStatus('stream ended');
      addLog('info', 'stream ended without done event');
    }
  }

  function stop(msg) {
    if (abortController) { abortController.abort(); abortController = null; }
    goBtn.disabled = false;
    stopBtn.disabled = true;
    if (msg) setStatus(msg);
  }

  function onMessage(line) {
    let m;
    try { m = JSON.parse(line); } catch (_) { return; }

    if (m.type === 'page') {
      pageCount++;
      if (m.status === 'ok') {
        addLog('ok', 'ok    ' + m.url + (m.links != null ? '   (' + m.links + ' links)' : ''));
        try {
          const u = new URL(m.url);
          pageNodes.set(m.url, {
            url: m.url,
            path: u.pathname,
            host: u.hostname,
            depth: m.depth || 0,
            source: m.source,
            files: 0,
            fileList: []
          });
        } catch (_) {}
        if (panels.map.classList.contains('active')) requestAnimationFrame(drawMap);
      } else {
        errCount++;
        addLog('fail', 'fail  ' + m.url + '   — ' + (m.reason || 'unknown'));
      }
      setStatus('scanning — ' + pageCount + ' pages · ' + fileCount + ' files');
    } else if (m.type === 'file') {
      if (pageNodes.has(m.file.page)) {
        const node = pageNodes.get(m.file.page);
        node.files++;
        node.fileList.push(m.file);
        if (panels.map.classList.contains('active')) requestAnimationFrame(drawMap);
      }
      addRow(m.file);
      addLog('file', 'file  ' + m.file.host + ' / ' + m.file.name + '   ← ' + m.file.page);
    } else if (m.type === 'host') {
      addLog('info', 'host  ' + m.host);
    } else if (m.type === 'error') {
      errCount++;
      addLog('fail', 'error — ' + (m.message || 'unknown'));
    } else if (m.type === 'done') {
      finished = true;
      const s = m.stats || { pages: pageCount, files: fileCount, failed: errCount };
      setStatus('done — ' + s.pages + ' pages · ' + s.files + ' files · ' + s.failed + ' errors');
      addLog('info', 'done  — ' + s.pages + ' pages · ' + s.files + ' files · ' + s.failed + ' errors');
      stop('');

      if (m.resume && m.resume.queue && m.resume.queue.length > 0) {
        pendingResume = m.resume;
        continueBtn.disabled = false;
        continueBtn.textContent = 'continue +1 worker (' + m.resume.queue.length + ' queued)';
        addLog('info', m.resume.queue.length + ' URLs still queued — click continue to spin up a new worker');
      } else {
        pendingResume = null;
        continueBtn.disabled = true;
        continueBtn.textContent = 'continue +1 worker';
        addLog('info', 'crawl complete — queue empty');
      }

      if (s.files === 0 && tbody.children.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 4; td.className = 'empty';
        td.textContent = 'no audio files found (try raising depth / max pages, or set a scope domain)';
        tr.appendChild(td); tbody.appendChild(tr);
      }
    }
  }

  function addRow(f) {
    fileCount++;
    rowCount++;
    const tr = document.createElement('tr');

    const tdHost = document.createElement('td');
    tdHost.className = 'host';
    tdHost.textContent = f.host;

    const tdName = document.createElement('td');
    tdName.className = 'name trunc';
    tdName.textContent = f.name;
    tdName.title = f.url;

    const tdPage = document.createElement('td');
    tdPage.className = 'page trunc';
    tdPage.textContent = f.page;
    tdPage.title = f.page;

    const tdAct = document.createElement('td');
    tdAct.className = 'act';

    const playBtn = document.createElement('button');
    playBtn.type = 'button'; playBtn.className = 'mini'; playBtn.textContent = 'play';
    playBtn.addEventListener('click', function () { playFile(f, tr); });

    const dlBtn = document.createElement('button');
    dlBtn.type = 'button'; dlBtn.className = 'mini alt'; dlBtn.textContent = 'download';
    dlBtn.addEventListener('click', function () { downloadFile(f); });

    tdAct.appendChild(playBtn);
    tdAct.appendChild(dlBtn);

    tr.appendChild(tdHost);
    tr.appendChild(tdName);
    tr.appendChild(tdPage);
    tr.appendChild(tdAct);
    tr.dataset.search = (f.host + ' ' + f.name + ' ' + f.url + ' ' + f.page).toLowerCase();

    tbody.appendChild(tr);
    applyFilterTo(tr);
    setStatus('scanning — ' + pageCount + ' pages · ' + fileCount + ' files');
  }

  function playFile(f, tr) {
    document.querySelectorAll('tr.playing').forEach(function (r) { r.classList.remove('playing'); });
    if(tr) tr.classList.add('playing');
    player.hidden = false;
    nowPlaying.textContent = f.host + ' / ' + f.name;
    nowPlaying.title = f.url;
    audio.src = '/api/file?url=' + encodeURIComponent(f.url);
    const p = audio.play();
    if (p && p.catch) p.catch(function () { });
  }

  function downloadFile(f) {
    const a = document.createElement('a');
    a.href = '/api/file?dl=1&url=' + encodeURIComponent(f.url);
    a.download = f.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function applyFilter() {
    document.querySelectorAll('#tbody tr').forEach(applyFilterTo);
  }

  function applyFilterTo(tr) {
    const q = filterIn.value.trim().toLowerCase();
    if (!q || !tr.dataset.search) { tr.style.display = ''; return; }
    tr.style.display = tr.dataset.search.indexOf(q) === -1 ? 'none' : '';
  }

  // ---------------- map (force-directed graph) ----------------

  function drawMap() {
    const rect = mapSvg.getBoundingClientRect();
    if (rect.width === 0) return;
    const W = rect.width, H = rect.height;
    mapSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    mapSvg.innerHTML = '';

    const NS = 'http://www.w3.org/2000/svg';
    function make(name, attrs) {
      const el = document.createElementNS(NS, name);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    }

    const nodes = Array.from(pageNodes.values());
    if (nodes.length === 0) {
      const t = make('text', {
        x: W / 2, y: H / 2, 'text-anchor': 'middle',
        'font-family': 'ui-monospace, monospace', 'font-size': 12, fill: '#767676'
      });
      t.textContent = 'start a crawl to see the map';
      mapSvg.appendChild(t);
      return;
    }

    const cx = W / 2, cy = H / 2;
    const maxDepth = Math.max(...nodes.map(n => n.depth), 0);

    // 1. Initial radial layout
    const rings = Array.from({ length: maxDepth + 1 }, () => []);
    nodes.forEach(n => rings[n.depth].push(n));
    rings.forEach(ring => ring.sort((a, b) => (a.source || '').localeCompare(b.source || '')));

    rings.forEach((ring, depth) => {
      const n = ring.length;
      const r = (Math.min(W, H) / 2.5) * (depth / (maxDepth || 1));
      ring.forEach((node, i) => {
        if (node.x === undefined) {
          if (depth === 0) {
            node.x = cx; node.y = cy;
          } else {
            const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
            node.x = cx + Math.cos(angle) * r;
            node.y = cy + Math.sin(angle) * r;
          }
          node.vx = 0; node.vy = 0;
        }
      });
    });

    // 2. Force simulation
    const iterations = 100;
    const k = Math.sqrt((W * H) / Math.max(nodes.length, 1)) * 0.8;
    const nodeMap = new Map(nodes.map(n => [n.url, n]));
    const validEdges = [];
    nodes.forEach(node => {
      if (node.source && nodeMap.has(node.source)) {
        validEdges.push({ source: nodeMap.get(node.source), target: node });
      }
    });

    for (let iter = 0; iter < iterations; iter++) {
      for (let j = 0; j < nodes.length; j++) {
        const n1 = nodes[j];
        for (let l = j + 1; l < nodes.length; l++) {
          const n2 = nodes[l];
          let dx = n2.x - n1.x; let dy = n2.y - n1.y;
          let distSq = dx * dx + dy * dy;
          if (distSq < 1) distSq = 1;
          
          if (distSq < (k * 2) ** 2) {
            let dist = Math.sqrt(distSq);
            let force = (k * k) / distSq;
            if (n1.depth === 0) { n2.vx += (dx/dist)*force*2; n2.vy += (dy/dist)*force*2; }
            else if (n2.depth === 0) { n1.vx -= (dx/dist)*force*2; n1.vy -= (dy/dist)*force*2; }
            else {
              n1.vx -= (dx/dist)*force; n1.vy -= (dy/dist)*force;
              n2.vx += (dx/dist)*force; n2.vy += (dy/dist)*force;
            }
          }
        }
      }

      validEdges.forEach(e => {
        let dx = e.target.x - e.source.x; let dy = e.target.y - e.source.y;
        let dist = Math.sqrt(dx*dx + dy*dy) || 1;
        let force = (dist - k) * 0.05;
        let fx = (dx/dist)*force; let fy = (dy/dist)*force;
        if (e.source.depth !== 0) { e.source.vx += fx; e.source.vy += fy; }
        if (e.target.depth !== 0) { e.target.vx -= fx; e.target.vy -= fy; }
      });

      nodes.forEach(n => {
        if (n.depth === 0) return;
        n.vx += (cx - n.x) * 0.02;
        n.vy += (cy - n.y) * 0.02;
      });

      nodes.forEach(n => {
        if (n.depth === 0) return;
        n.vx *= 0.5; n.vy *= 0.5;
        n.x += n.vx; n.y += n.vy;
        n.x = Math.max(40, Math.min(W - 40, n.x));
        n.y = Math.max(40, Math.min(H - 40, n.y));
      });
    }

    // Build Viewport Group
    const viewport = make('g', { id: 'map-viewport' });
    mapSvg.appendChild(viewport);

    // Draw edges
    validEdges.forEach(e => {
      viewport.appendChild(make('line', {
        class: 'edge',
        x1: e.source.x, y1: e.source.y, x2: e.target.x, y2: e.target.y,
        stroke: '#d9d9d9', 'stroke-width': 1
      }));
    });

    // Draw nodes
    nodes.forEach(node => {
      const isRoot = node.depth === 0;
      const hasFiles = node.files > 0;
      // Nodes half size
      const r = isRoot ? 6 : (hasFiles ? 3.5 : 2.25);
      const fill = isRoot ? '#ff3b00' : (hasFiles ? '#fff2ee' : '#fff');
      const stroke = isRoot ? 'none' : (hasFiles ? '#ff3b00' : '#111');
      const strokeW = isRoot ? 0 : (hasFiles ? 2 : 1.5);

      const circle = make('circle', {
        class: 'node-circle',
        cx: node.x, cy: node.y, r: r, fill: fill, stroke: stroke, 'stroke-width': strokeW
      });
      circle.style.pointerEvents = 'all';
      circle.addEventListener('click', (e) => {
        e.stopPropagation();
        selectNode(node);
      });
      viewport.appendChild(circle);

      let label = node.path;
      if (label === '/') label = isRoot ? 'ORIGIN' : '/ (Home)';
      if (label.length > 16) label = label.substring(0, 14) + '...';

      const dx = node.x - cx; const dy = node.y - cy;
      const dist = Math.sqrt(dx*dx + dy*dy);

      let textX = node.x, textY = node.y + (isRoot ? 14 : 10), textAnchor = 'middle';

      if (!isRoot && dist > 20) {
        if (Math.abs(dy) > Math.abs(dx)) {
          if (dy > 0) textY = node.y + 12;
          else textY = node.y - 6;
        } else {
          if (dx > 0) { textX = node.x + 8; textAnchor = 'start'; textY = node.y + 3; }
          else { textX = node.x - 8; textAnchor = 'end'; textY = node.y + 3; }
        }
      }

      const text = make('text', {
        class: 'node-text',
        x: textX, y: textY, 'text-anchor': textAnchor,
        'font-family': 'ui-monospace, monospace',
        'font-size': isRoot ? 10 : 8,
        'font-weight': isRoot ? 700 : 400,
        fill: isRoot ? '#111' : (hasFiles ? '#b3261e' : '#767676')
      });
      text.textContent = label;
      viewport.appendChild(text);
    });

    // Legend (outside viewport so it stays fixed)
    const legend = make('g', { transform: 'translate(16, 16)' });
    legend.appendChild(make('circle', { cx: 4, cy: 4, r: 4, fill: '#ff3b00' }));
    const t1 = make('text', { x: 12, y: 8, 'font-family': 'ui-monospace, monospace', 'font-size': 10, fill: '#111' });
    t1.textContent = 'Start'; legend.appendChild(t1);
    legend.appendChild(make('circle', { cx: 4, cy: 20, r: 2.25, fill: '#fff', stroke: '#111', 'stroke-width': 1.5 }));
    const t2 = make('text', { x: 12, y: 24, 'font-family': 'ui-monospace, monospace', 'font-size': 10, fill: '#111' });
    t2.textContent = 'Page'; legend.appendChild(t2);
    legend.appendChild(make('circle', { cx: 4, cy: 36, r: 3.5, fill: '#fff2ee', stroke: '#ff3b00', 'stroke-width': 2 }));
    const t3 = make('text', { x: 12, y: 40, 'font-family': 'ui-monospace, monospace', 'font-size': 10, fill: '#b3261e' });
    t3.textContent = 'Audio'; legend.appendChild(t3);
    mapSvg.appendChild(legend);

    // Restore transform & highlights
    applyTransform();
    applyHighlights();
    
    // Close sidebar on map background click
    mapSvg.addEventListener('click', function() {
       sidebar.classList.remove('open');
       selectedNodeUrl = null;
       applyHighlights();
    });
  }

  function selectNode(node) {
    selectedNodeUrl = node.url;
    
    // Populate sidebar
    sidebarTitle.textContent = node.path === '/' ? node.url : node.path;
    sidebarFiles.innerHTML = '';
    
    if (node.fileList.length === 0) {
      sidebarFiles.innerHTML = '<div style="color:var(--muted); font-size:12px;">No audio files found on this page.</div>';
    } else {
      node.fileList.forEach(f => {
        const div = document.createElement('div');
        div.className = 'file-item';
        
        const name = document.createElement('div');
        name.className = 'file-name';
        name.textContent = f.name;
        
        const acts = document.createElement('div');
        acts.className = 'file-actions';
        
        const play = document.createElement('button');
        play.textContent = 'play';
        play.onclick = () => playFile(f, null);
        
        const dl = document.createElement('button');
        dl.textContent = 'download';
        dl.onclick = () => downloadFile(f);
        
        acts.appendChild(play);
        acts.appendChild(dl);
        div.appendChild(name);
        div.appendChild(acts);
        sidebarFiles.appendChild(div);
      });
    }
    
    sidebar.classList.add('open');
    applyHighlights();
  }

  function applyHighlights() {
    const viewport = mapSvg.querySelector('#map-viewport');
    if (!viewport) return;
    
    const circles = viewport.querySelectorAll('.node-circle');
    const texts = viewport.querySelectorAll('.node-text');
    const edges = viewport.querySelectorAll('.edge');

    // Reset everything
    circles.forEach(el => el.classList.remove('dimmed', 'highlighted', 'selected-node'));
    texts.forEach(el => el.classList.remove('dimmed', 'highlighted'));
    edges.forEach(el => el.classList.remove('dimmed', 'highlighted-edge'));

    if (!selectedNodeUrl) return; // No selection, stop here

    // Find path to origin
    const pathUrls = new Set();
    let current = pageNodes.get(selectedNodeUrl);
    while (current) {
      pathUrls.add(current.url);
      current = current.source ? pageNodes.get(current.source) : null;
    }

    // Dim nodes and highlight path nodes
    circles.forEach((el, i) => {
      const node = Array.from(pageNodes.values())[i]; // Assumes order matches drawing
      // Fallback: identify by cx/cy
      const nodeData = Array.from(pageNodes.values()).find(n => n.x == el.getAttribute('cx') && n.y == el.getAttribute('cy'));
      
      if (nodeData && pathUrls.has(nodeData.url)) {
        el.classList.add('highlighted');
        if (nodeData.url === selectedNodeUrl) el.classList.add('selected-node');
      } else {
        el.classList.add('dimmed');
      }
    });

    texts.forEach(el => {
      // Use node matching via label text roughly or skip text dimming if too complex
      if (el.textContent === 'ORIGIN' || el.textContent.includes(selectedNodeUrl.split('/').pop())) {
        el.classList.add('highlighted');
      } else {
        el.classList.add('dimmed');
      }
    });

    edges.forEach(el => {
      // Check if edge source/target connects two nodes in path
      let x1 = parseFloat(el.getAttribute('x1')), y1 = parseFloat(el.getAttribute('y1'));
      let x2 = parseFloat(el.getAttribute('x2')), y2 = parseFloat(el.getAttribute('y2'));
      
      const n1 = Array.from(pageNodes.values()).find(n => Math.abs(n.x - x1) < 1 && Math.abs(n.y - y1) < 1);
      const n2 = Array.from(pageNodes.values()).find(n => Math.abs(n.x - x2) < 1 && Math.abs(n.y - y2) < 1);

      if (n1 && n2 && pathUrls.has(n1.url) && pathUrls.has(n2.url)) {
        el.classList.add('highlighted-edge');
      } else {
        el.classList.add('dimmed');
      }
    });
  }
})();
</script>
</body>
</html>
