<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>audiocrawler</title>
<style>
  :root{
    --fg:#111; --bg:#fff; --line:#111; --soft:#d9d9d9;
    --muted:#767676; --accent:#ff3b00; --hover:#f1f1f1;
  }
  *{ box-sizing:border-box; border-radius:0 !important; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg); color:var(--fg);
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    padding-bottom:64px;
  }
  header{ display:flex; align-items:baseline; gap:16px; padding:14px 16px; border-bottom:2px solid var(--line); }
  header h1{ margin:0; font-size:15px; letter-spacing:3px; text-transform:uppercase; font-weight:700; }
  header .note{ color:var(--muted); font-size:12px; }

  form{ display:flex; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  form input[type=text], form input[type=url]{
    flex:1 1 180px; min-width:0; border:0; border-right:1px solid var(--soft);
    padding:10px 12px; font:inherit; color:inherit; background:transparent; outline:none;
  }
  form input[type=text]:focus, form input[type=url]:focus{ background:#fafafa; box-shadow:inset 0 -2px 0 var(--accent); }
  form input[type=number]{ flex:0 0 90px; text-align:center; border:0; border-right:1px solid var(--soft); padding:10px 12px; font:inherit; background:transparent; outline:none; }

  .form-btn-group { display:flex; flex-direction:column; border-left:1px solid var(--line); }
  form button{
    border:0; background:var(--fg); color:#fff;
    padding:10px 20px; font:inherit; letter-spacing:2px; text-transform:uppercase;
    cursor:pointer; flex:1;
  }
  form button:hover:not(:disabled){ background:var(--accent); }
  form button:disabled{ background:#bbb; cursor:not-allowed; }
  form button#stop{ background:#fff; color:var(--fg); border-bottom:1px solid var(--soft); }
  form button#stop:hover:not(:disabled){ background:var(--accent); color:#fff; }
  form button#continue{ background:#fff; color:var(--fg); }
  form button#continue:hover:not(:disabled){ background:var(--accent); color:#fff; }
  form button#continue:disabled{ background:#fff; color:#bbb; }

  #bar{ display:flex; align-items:center; gap:12px; padding:8px 16px; border-bottom:1px solid var(--soft); }
  #status{ color:var(--muted); flex:1; }
  #filter{
    border:1px solid var(--soft); padding:5px 8px; font:inherit; color:inherit;
    background:transparent; outline:none; width:220px;
  }
  #filter:focus{ border-color:var(--line); }

  .auto-cont { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); cursor:pointer; user-select:none; }
  .auto-cont input { margin:0; cursor:pointer; }

  #tabs{ display:flex; border-bottom:1px solid var(--line); background:#fff; }
  #tabs button{
    flex:0 0 auto;
    border:0; border-right:1px solid var(--soft);
    border-bottom:2px solid transparent;
    background:transparent; color:var(--muted);
    font:inherit; font-size:11px; letter-spacing:2px; text-transform:uppercase;
    padding:10px 18px; cursor:pointer;
  }
  #tabs button:hover{ background:var(--hover); color:var(--fg); }
  #tabs button.active{ color:var(--fg); border-bottom-color:var(--accent); font-weight:700; }

  .panel{ display:none; }
  .panel.active{ display:block; }

  table{ width:100%; border-collapse:collapse; }
  th,td{ text-align:left; padding:6px 12px; border-bottom:1px solid #eee; vertical-align:top; }
  th{
    font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted);
    font-weight:400; border-bottom:1px solid var(--line); background:#fff;
  }
  tbody tr:hover{ background:var(--hover); }
  tbody tr.playing{ background:#fff2ee; box-shadow:inset 3px 0 0 var(--accent); }
  .trunc{ max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  td.host{ color:var(--accent); white-space:nowrap; }
  td.name{ font-weight:700; }
  td.page{ color:var(--muted); }
  td.act{ white-space:nowrap; text-align:right; }
  button.mini{
    border:1px solid var(--line); background:#fff; color:var(--fg);
    font:inherit; font-size:11px; letter-spacing:1px; padding:3px 9px;
    cursor:pointer; margin-left:6px;
  }
  button.mini:hover{ background:var(--fg); color:#fff; }
  button.mini.alt:hover{ background:var(--accent); border-color:var(--accent); color:#fff; }

  #logs{
    padding:10px 16px;
    font-size:12px;
    line-height:1.55;
    height:calc(100dvh - 240px);
    min-height:300px;
    overflow-y:auto;
    background:#fafafa;
    border-bottom:1px solid var(--soft);
  }
  .log{ padding:2px 0; white-space:pre-wrap; word-break:break-word; }
  .log-ok    { color:#0a7a3a; }
  .log-fail  { color:#b3261e; }
  .log-file  { color:var(--fg); }
  .log-info  { color:var(--muted); }
  .log-time  { color:#aaa; margin-right:8px; }

  /* ---------------- map ---------------- */
  #panel-map{ padding:16px; position:relative; }
  #map-wrap{ position:relative; }

  #cosmos-map{
    display:block;
    width:100%;
    height:calc(100dvh - 240px);
    min-height:400px;
    background:#fafafa;
    border:1px solid var(--soft);
    overflow:hidden;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    position:relative;
  }
  #cosmos-map canvas{ display:block; }

  .map-ctrl {
    position:absolute; top:16px; right:16px; z-index:20;
    display:flex; gap:8px;
  }
  .map-ctrl button {
    border:1px solid var(--line); background:#fff; color:var(--fg);
    font:inherit; font-size:11px; padding:6px 10px; letter-spacing:1px; text-transform:uppercase;
    cursor:pointer; box-shadow:2px 2px 0 rgba(0,0,0,0.05);
  }
  .map-ctrl button:hover { background:var(--fg); color:#fff; }

  #map-legend{
    position:absolute; top:16px; left:16px; z-index:15;
    padding:10px 12px;
    background:rgba(255,255,255,0.92);
    border:1px solid var(--line);
    font-size:11px; line-height:1.7;
    pointer-events:none; user-select:none;
  }
  #map-legend .lg-row{ display:flex; align-items:center; gap:8px; }
  #map-legend .lg-dot{
    display:inline-block; width:9px; height:9px; border-radius:50%;
    flex:0 0 auto; background:#fff; border:1px solid #bbb;
  }
  #map-legend .lg-dot.start{ background:#ff3b00; border-color:#ff3b00; }
  #map-legend .lg-dot.crawled{ background:#fff; border-color:#bbb; }
  #map-legend .lg-dot.audio{ background:#fff2ee; border-color:#ff3b00; border-width:2px; }
  #map-legend .lg-hint{ margin-top:6px; color:#aaa; font-size:10px; }

  .map-overlay{
    position:absolute; inset:0; z-index:2;
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:13px;
    pointer-events:none; user-select:none;
  }
  .map-overlay[hidden]{ display:none; }

  #node-popup{
    position:absolute; z-index:20;
    width:238px; max-height:280px;
    display:flex; flex-direction:column;
    background:#fff; border:1px solid var(--line);
    box-shadow:5px 5px 0 rgba(17,17,17,.13);
    font-size:11px; line-height:1.4;
  }
  #node-popup[hidden]{ display:none; }
  #node-popup .np-head{
    display:flex; align-items:center; gap:8px;
    padding:7px 9px; border-bottom:1px solid var(--soft);
  }
  #node-popup .np-dot{ width:7px; height:7px; background:var(--accent); flex:0 0 auto; }
  #node-popup .np-path{
    flex:1; min-width:0; font-weight:700; letter-spacing:.5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #node-popup .np-close{
    border:0; background:transparent; color:var(--muted);
    font:inherit; font-size:14px; line-height:1; padding:0 2px; cursor:pointer;
  }
  #node-popup .np-close:hover{ color:var(--accent); }
  #node-popup .np-meta{
    padding:5px 9px; color:var(--muted); border-bottom:1px solid #eee;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #node-popup .np-list{ overflow-y:auto; min-height:0; padding:3px 0; }
  #node-popup .np-empty{ padding:8px 9px; color:var(--muted); }
  #node-popup .np-file{ display:flex; align-items:center; gap:6px; padding:3px 9px; }
  #node-popup .np-file:hover{ background:var(--hover); }
  #node-popup .np-file span{
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  #player{
    position:fixed; left:0; right:0; bottom:0; display:flex; align-items:center; gap:12px;
    padding:10px 16px; background:#fff; border-top:2px solid var(--line);
  }
  #player[hidden]{ display:none; }
  #nowplaying{ flex:0 1 320px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #audio{ flex:1; height:32px; min-width:200px; }
  #closePlayer{
    border:1px solid var(--line); background:#fff; color:var(--fg);
    font:inherit; padding:4px 10px; cursor:pointer;
  }
  #closePlayer:hover{ background:var(--fg); color:#fff; }
  .empty{ padding:24px 16px; color:var(--muted); }
</style>
</head>
<body>

<header>
  <h1>audiocrawler</h1>
  <span class="note">crawl a site + its subdomains for audio files</span>
</header>

<form id="form">
  <input id="url" type="url" placeholder="https://example.com" required spellcheck="false" autocomplete="off">
  <input id="scope" type="text" placeholder="scope domain (auto)" spellcheck="false" autocomplete="off">
  <input id="pages" type="number" value="40" min="1" max="2000" title="max pages per worker">
  <input id="depth" type="number" value="10" min="0" title="max depth">
  <div class="form-btn-group">
    <button id="go" type="submit">crawl</button>
    <button id="stop" type="button" disabled>stop</button>
    <button id="continue" type="button" disabled>continue +1 worker</button>
  </div>
</form>

<div id="bar">
  <span id="status">idle</span>
  <label class="auto-cont"><input type="checkbox" id="autoContinue"> auto-continue</label>
  <input id="filter" placeholder="filter…" spellcheck="false" autocomplete="off">
</div>

<nav id="tabs">
  <button type="button" data-tab="output" class="active">output</button>
  <button type="button" data-tab="logs">logs</button>
  <button type="button" data-tab="map">map</button>
</nav>

<section id="panel-output" class="panel active">
  <table>
    <thead>
      <tr><th>host</th><th>file</th><th>found on</th><th></th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</section>

<section id="panel-logs" class="panel">
  <div id="logs"></div>
</section>

<section id="panel-map" class="panel">
  <div id="map-wrap">
    <div class="map-ctrl">
      <button id="btn-fit" type="button">Fit</button>
    </div>
    <div id="cosmos-map"></div>
    <div id="map-legend">
      <div class="lg-row"><span class="lg-dot start"></span>Start Page</div>
      <div class="lg-row"><span class="lg-dot crawled"></span>Crawled Page</div>
      <div class="lg-row"><span class="lg-dot audio"></span>Page with Audio</div>
      <div class="lg-hint">drag · scroll / pinch · click node</div>
    </div>
    <div id="map-empty" class="map-overlay">start a crawl to see the map</div>
    <div id="node-popup" hidden></div>
  </div>
</section>

<footer id="player" hidden>
  <span id="nowplaying">—</span>
  <audio id="audio" controls preload="none"></audio>
  <button id="closePlayer" type="button">×</button>
</footer>

<!-- Cosmograph WebGL graph engine (v2) -->
<script src="https://cdn.jsdelivr.net/npm/@cosmograph/cosmos@2.0.0-beta.20/dist/index.min.js"></script>

<script>
(function () {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const form = $('#form'), urlIn = $('#url'), scopeIn = $('#scope'),
        pagesIn = $('#pages'), depthIn = $('#depth'),
        goBtn = $('#go'), stopBtn = $('#stop'), continueBtn = $('#continue'),
        autoContinueCb = $('#autoContinue'), statusEl = $('#status'),
        tbody = $('#tbody'), player = $('#player'), audio = $('#audio'),
        nowPlaying = $('#nowplaying'), filterIn = $('#filter'),
        tabsNav = $('#tabs'), logsEl = $('#logs'),
        mapWrap = $('#map-wrap'), popupEl = $('#node-popup'),
        fitBtn = $('#btn-fit'), mapEmptyEl = $('#map-empty');

  const panels = {
    output: $('#panel-output'),
    logs:   $('#panel-logs'),
    map:    $('#panel-map')
  };

  let abortController = null;
  let finished = false, pageCount = 0, fileCount = 0, errCount = 0, rowCount = 0;

  let originUrl = '';
  const pageNodes = new Map();

  let pendingResume = null;
  let lockedParams = null;

  form.addEventListener('submit', function (e) { e.preventDefault(); begin(); });
  stopBtn.addEventListener('click', function () { stop('stopped'); });
  continueBtn.addEventListener('click', continueCrawl);
  filterIn.addEventListener('input', applyFilter);
  fitBtn.addEventListener('click', fitView);

  $('#closePlayer').addEventListener('click', function () {
    audio.pause(); audio.removeAttribute('src'); audio.load();
    player.hidden = true;
    document.querySelectorAll('tr.playing').forEach(function (r) { r.classList.remove('playing'); });
  });

  tabsNav.addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-tab]');
    if (!btn) return;
    const tab = btn.dataset.tab;
    tabsNav.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    Object.keys(panels).forEach(function (k) { panels[k].classList.toggle('active', k === tab); });
    if (tab === 'map') {
      requestAnimationFrame(function () {
        drawMap();
        setTimeout(fitView, 60);
      });
    }
    if (tab === 'logs') logsEl.scrollTop = logsEl.scrollHeight;
  });

  window.addEventListener('resize', function () {
    if (cosmosGraph && cosmosGraph.resize && panels.map.classList.contains('active')) {
      try { cosmosGraph.resize(); } catch (_) {}
    }
  });

  function setStatus(t) { statusEl.textContent = t; }

  function addLog(kind, msg) {
    const line = document.createElement('div');
    line.className = 'log log-' + kind;
    const t = document.createElement('span');
    t.className = 'log-time';
    t.textContent = new Date().toLocaleTimeString();
    line.appendChild(t);
    line.appendChild(document.createTextNode(msg));
    logsEl.appendChild(line);
    const nearBottom = logsEl.scrollTop + logsEl.clientHeight >= logsEl.scrollHeight - 60;
    if (nearBottom) logsEl.scrollTop = logsEl.scrollHeight;
  }

  function begin() {
    stop('');
    pendingResume = null;
    lockedParams = null;
    finished = false; pageCount = 0; fileCount = 0; errCount = 0; rowCount = 0;
    tbody.textContent = '';
    logsEl.textContent = '';
    player.hidden = true;
    audio.pause(); audio.removeAttribute('src');

    pageNodes.clear();
    selectedUrl = null;
    popupEl.hidden = true;
    lastDrawnNodeCount = -1;
    lastDrawnFileCount = -1;

    continueBtn.disabled = true;
    continueBtn.textContent = 'continue +1 worker';

    if (panels.map.classList.contains('active')) requestAnimationFrame(drawMap);
    else scheduleDraw();

    addLog('info', 'starting crawl: ' + urlIn.value.trim());
    startCrawl(null);
  }

  function continueCrawl() {
    if (!pendingResume) return;
    const resume = pendingResume;
    pendingResume = null;
    addLog('info', 'continuing with new worker (' + resume.queue.length + ' URLs queued)');
    startCrawl(resume);
  }

  function startCrawl(resume) {
    finished = false;

    if (!resume) {
      lockedParams = { url: urlIn.value.trim(), scope: scopeIn.value.trim() };
      originUrl = lockedParams.url;
    }

    const params = new URLSearchParams({
      url: lockedParams.url,
      scope: lockedParams.scope,
      maxPages: pagesIn.value,
      maxDepth: depthIn.value
    });

    setStatus(resume ? 'continuing…' : 'connecting…');
    goBtn.disabled = true;
    stopBtn.disabled = false;
    continueBtn.disabled = true;

    if (!resume) addLog('info', 'scope: ' + (lockedParams.scope || '(auto)'));

    abortController = new AbortController();
    runCrawl(params, abortController.signal, resume);
  }

  async function runCrawl(params, signal, resume) {
    try {
      let res;
      if (resume) {
        res = await fetch('/api/crawl?' + params.toString(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resume }),
          signal
        });
      } else {
        res = await fetch('/api/crawl?' + params.toString(), { signal });
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      if (!res.body) throw new Error('no response body');

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf('\n')) >= 0) {
          const line = buffer.slice(0, idx).trim();
          buffer = buffer.slice(idx + 1);
          if (line) onMessage(line);
        }
      }
      if (buffer.trim()) onMessage(buffer.trim());
    } catch (err) {
      if (err.name !== 'AbortError') {
        stop('connection lost');
        addLog('fail', 'connection lost: ' + String(err.message || err));
        return;
      }
    }
    stop('');
    if (!finished) {
      setStatus('stream ended');
      addLog('info', 'stream ended without done event');
    }
  }

  function stop(msg) {
    if (abortController) { abortController.abort(); abortController = null; }
    goBtn.disabled = false;
    stopBtn.disabled = true;
    if (msg) setStatus(msg);
  }

  function onMessage(line) {
    let m;
    try { m = JSON.parse(line); } catch (_) { return; }

    if (m.type === 'page') {
      pageCount++;
      if (m.status === 'ok') {
        addLog('ok', 'ok    ' + m.url + (m.links != null ? '   (' + m.links + ' links)' : ''));
        try {
          const u = new URL(m.url);
          pageNodes.set(m.url, {
            url: m.url,
            path: u.pathname,
            host: u.hostname,
            depth: m.depth || 0,
            source: m.source,
            files: []
          });
        } catch (_) {}
        if (panels.map.classList.contains('active')) scheduleDraw();
      } else {
        errCount++;
        addLog('fail', 'fail  ' + m.url + '   — ' + (m.reason || 'unknown'));
      }
      setStatus('scanning — ' + pageCount + ' pages · ' + fileCount + ' files');
    } else if (m.type === 'file') {
      if (pageNodes.has(m.file.page)) {
        pageNodes.get(m.file.page).files.push(m.file);
        if (panels.map.classList.contains('active')) scheduleDraw();
      }
      addRow(m.file);
      addLog('file', 'file  ' + m.file.host + ' / ' + m.file.name + '   ← ' + m.file.page);
    } else if (m.type === 'host') {
      addLog('info', 'host  ' + m.host);
    } else if (m.type === 'error') {
      errCount++;
      addLog('fail', 'error — ' + (m.message || 'unknown'));
    } else if (m.type === 'done') {
      finished = true;
      const s = m.stats || { pages: pageCount, files: fileCount, failed: errCount };
      setStatus('done — ' + s.pages + ' pages · ' + s.files + ' files · ' + s.failed + ' errors');
      addLog('info', 'done  — ' + s.pages + ' pages · ' + s.files + ' files · ' + s.failed + ' errors');
      stop('');

      if (m.resume && m.resume.queue && m.resume.queue.length > 0) {
        pendingResume = m.resume;
        continueBtn.disabled = false;
        continueBtn.textContent = 'continue +1 worker (' + m.resume.queue.length + ' queued)';
        addLog('info', m.resume.queue.length + ' URLs still queued — click continue to spin up a new worker');

        if (autoContinueCb.checked) {
          addLog('info', 'auto-continue triggered…');
          setTimeout(continueCrawl, 1000);
        }
      } else {
        pendingResume = null;
        continueBtn.disabled = true;
        continueBtn.textContent = 'continue +1 worker';
        addLog('info', 'crawl complete — queue empty');
      }

      if (s.files === 0 && !tbody.querySelector('td.empty')) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 4; td.className = 'empty';
        td.textContent = 'no audio files found (try raising depth / max pages, or set a scope domain)';
        tr.appendChild(td); tbody.appendChild(tr);
      }

      if (panels.map.classList.contains('active')) {
        drawMap();
        setTimeout(fitView, 120);
      }
    }
  }

  function addRow(f) {
    const emptyTd = tbody.querySelector('td.empty');
    if (emptyTd) {
      const emptyRow = emptyTd.closest('tr');
      if (emptyRow) emptyRow.remove();
    }

    fileCount++;
    rowCount++;
    const tr = document.createElement('tr');

    const tdHost = document.createElement('td');
    tdHost.className = 'host';
    tdHost.textContent = f.host;

    const tdName = document.createElement('td');
    tdName.className = 'name trunc';
    tdName.textContent = f.name;
    tdName.title = f.url;

    const tdPage = document.createElement('td');
    tdPage.className = 'page trunc';
    tdPage.textContent = f.page;
    tdPage.title = f.page;

    const tdAct = document.createElement('td');
    tdAct.className = 'act';

    const playBtn = document.createElement('button');
    playBtn.type = 'button'; playBtn.className = 'mini'; playBtn.textContent = 'play';
    playBtn.addEventListener('click', function () { playFile(f, tr); });

    const dlBtn = document.createElement('button');
    dlBtn.type = 'button'; dlBtn.className = 'mini alt'; dlBtn.textContent = 'download';
    dlBtn.addEventListener('click', function () { downloadFile(f); });

    tdAct.appendChild(playBtn);
    tdAct.appendChild(dlBtn);

    tr.appendChild(tdHost);
    tr.appendChild(tdName);
    tr.appendChild(tdPage);
    tr.appendChild(tdAct);
    tr.dataset.search = (f.host + ' ' + f.name + ' ' + f.url + ' ' + f.page).toLowerCase();

    tbody.appendChild(tr);
    applyFilterTo(tr);
    setStatus('scanning — ' + pageCount + ' pages · ' + fileCount + ' files');
  }

  function playFile(f, tr) {
    document.querySelectorAll('tr.playing').forEach(function (r) { r.classList.remove('playing'); });
    if (tr) tr.classList.add('playing');
    player.hidden = false;
    nowPlaying.textContent = f.host + ' / ' + f.name;
    nowPlaying.title = f.url;
    audio.src = '/api/file?url=' + encodeURIComponent(f.url);
    const p = audio.play();
    if (p && p.catch) p.catch(function () { });
  }

  function downloadFile(f) {
    const a = document.createElement('a');
    a.href = '/api/file?dl=1&url=' + encodeURIComponent(f.url);
    a.download = f.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function applyFilter() {
    document.querySelectorAll('#tbody tr').forEach(applyFilterTo);
  }

  function applyFilterTo(tr) {
    const q = filterIn.value.trim().toLowerCase();
    if (!q || !tr.dataset.search) { tr.style.display = ''; return; }
    tr.style.display = tr.dataset.search.indexOf(q) === -1 ? 'none' : '';
  }

  // ==========================================================================
  // MAP  —  Cosmograph v2 (WebGL)
  // ==========================================================================

  let cosmosGraph = null;
  let nodeUrls = [];
  let selectedUrl = null;
  let lastPointerX = 0, lastPointerY = 0;
  let drawScheduled = false;
  let lastDrawnNodeCount = -1;
  let lastDrawnFileCount = -1;

  mapWrap.addEventListener('pointerdown', function (e) {
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
  }, true);

  function initCosmos() {
    if (cosmosGraph) return true;
    const container = document.getElementById('cosmos-map');
    if (!container) return false;

    if (typeof Cosmos === 'undefined' || !Cosmos.Graph) {
      console.error('Cosmograph library not loaded');
      container.innerHTML =
        '<div style="padding:24px;color:#767676;font-family:inherit">' +
        'Map library failed to load. Check your network and refresh.' +
        '</div>';
      return false;
    }

    try {
      cosmosGraph = new Cosmos.Graph(container, {
        // --- Simulation parameters tuned for spreading out nodes ---
        simulationGravity: 0.05,        // Reduced gravity to prevent collapse
        simulationRepulsion: 1.8,       // Strong repulsion to push nodes apart
        simulationLinkSpring: 0.4,      // Weaker link spring so links don't pull too hard
        simulationLinkDistance: 60,     // Increased minimum link distance
        simulationFriction: 0.92,
        spaceSize: 8192,
        backgroundColor: '#fafafa',
        enableDrag: true,
        rescalePositions: true,         // Helpful for initial layout
        curvedLinks: false,             // Straight links are clearer
        fitViewOnInit: true,
        fitViewDelay: 1200,             // Wait for simulation to settle
        fitViewPadding: 0.3,            // Padding around the graph
        onClick: function (index) { handleNodeClick(index); }
      });
      return true;
    } catch (err) {
      console.error('Cosmograph init failed:', err);
      container.innerHTML =
        '<div style="padding:24px;color:#767676;font-family:inherit">' +
        'Map init failed: ' + String(err.message || err) +
        '</div>';
      return false;
    }
  }

  function handleNodeClick(index) {
    const url = nodeUrls[index];
    if (!url) return;
    if (selectedUrl === url) {
      selectedUrl = null;
      popupEl.hidden = true;
    } else {
      selectedUrl = url;
      showPopup(pageNodes.get(url), lastPointerX, lastPointerY);
    }
  }

  function scheduleDraw() {
    if (drawScheduled) return;
    drawScheduled = true;
    setTimeout(function () {
      drawScheduled = false;
      drawMap();
    }, 250);
  }

  function fitView() {
    if (cosmosGraph && typeof cosmosGraph.fitView === 'function') {
      try { cosmosGraph.fitView(); } catch (_) {}
    }
  }

  function drawMap() {
    if (!panels.map.classList.contains('active')) return;
    if (!initCosmos()) return;

    const nodes = Array.from(pageNodes.values());
    const totalFiles = nodes.reduce(function (s, n) { return s + n.files.length; }, 0);

    if (nodes.length === lastDrawnNodeCount && totalFiles === lastDrawnFileCount) {
      return;
    }
    lastDrawnNodeCount = nodes.length;
    lastDrawnFileCount = totalFiles;

    mapEmptyEl.hidden = nodes.length > 0;

    if (nodes.length === 0) {
      try {
        cosmosGraph.setPointPositions(new Float32Array(0));
        cosmosGraph.setLinks(new Float32Array(0));
        cosmosGraph.render();
      } catch (_) {}
      return;
    }

    nodeUrls = nodes.map(function (n) { return n.url; });
    const nodeIndex = new Map();
    nodeUrls.forEach(function (url, i) { nodeIndex.set(url, i); });

    const N = nodes.length;
    const positions = new Float32Array(N * 2);

    let maxDepth = 0;
    for (let i = 0; i < N; i++) if (nodes[i].depth > maxDepth) maxDepth = nodes[i].depth;

    const rings = [];
    for (let d = 0; d <= maxDepth; d++) rings.push([]);
    for (let i = 0; i < N; i++) rings[nodes[i].depth].push(i);

    const RADIUS = 2048;
    for (let d = 0; d < rings.length; d++) {
      const ring = rings[d];
      const count = ring.length;
      for (let i = 0; i < count; i++) {
        const idx = ring[i];
        let x, y;
        if (d === 0) {
          x = 0; y = 0;
        } else {
          const angle = (i / count) * Math.PI * 2;
          const r = RADIUS * (d / (maxDepth || 1));
          x = Math.cos(angle) * r;
          y = Math.sin(angle) * r;
        }
        positions[idx * 2] = x;
        positions[idx * 2 + 1] = y;
      }
    }

    const links = [];
    for (let i = 0; i < N; i++) {
      const n = nodes[i];
      if (n.source) {
        const si = nodeIndex.get(n.source);
        if (si !== undefined) {
          links.push(si, i);
        }
      }
    }

    try {
      cosmosGraph.setPointPositions(positions);
      cosmosGraph.setLinks(new Float32Array(links));
      cosmosGraph.render();
    } catch (err) {
      console.error('Cosmograph setData failed:', err);
    }
  }

  function showPopup(node, px, py) {
    if (!node) { popupEl.hidden = true; return; }
    popupEl.textContent = '';

    const head = document.createElement('div');
    head.className = 'np-head';

    const dot = document.createElement('span');
    dot.className = 'np-dot';

    const pathEl = document.createElement('span');
    pathEl.className = 'np-path';
    pathEl.textContent = node.path === '/' ? 'ORIGIN' : node.path;
    pathEl.title = node.url;

    const close = document.createElement('button');
    close.type = 'button';
    close.className = 'np-close';
    close.textContent = '×';
    close.title = 'clear selection';
    close.addEventListener('click', function () {
      selectedUrl = null;
      popupEl.hidden = true;
    });

    head.appendChild(dot);
    head.appendChild(pathEl);
    head.appendChild(close);
    popupEl.appendChild(head);

    const meta = document.createElement('div');
    meta.className = 'np-meta';
    const n = node.files.length;
    meta.textContent = node.host + ' · ' + (n ? n + ' audio file' + (n > 1 ? 's' : '') : 'no audio files');
    meta.title = node.url;
    popupEl.appendChild(meta);

    const list = document.createElement('div');
    list.className = 'np-list';

    if (!n) {
      const empty = document.createElement('div');
      empty.className = 'np-empty';
      empty.textContent = 'no audio files on this page';
      list.appendChild(empty);
    } else {
      node.files.forEach(function (f) {
        const row = document.createElement('div');
        row.className = 'np-file';

        const name = document.createElement('span');
        name.textContent = f.name;
        name.title = f.url;

        const play = document.createElement('button');
        play.type = 'button';
        play.className = 'mini';
        play.textContent = 'play';
        play.addEventListener('click', function () { playFile(f, null); });

        row.appendChild(name);
        row.appendChild(play);
        list.appendChild(row);
      });
    }

    popupEl.appendChild(list);
    popupEl.hidden = false;
    positionPopup(px, py);
  }

  function positionPopup(px, py) {
    const rect = mapWrap.getBoundingClientRect();
    const pw = popupEl.offsetWidth;
    const ph = popupEl.offsetHeight;
    const W = rect.width;
    const H = rect.height;

    let left = px - rect.left + 14;
    if (left + pw > W - 6) left = px - rect.left - pw - 14;
    left = Math.max(6, Math.min(left, W - pw - 6));

    let top = py - rect.top - ph / 2;
    top = Math.max(6, Math.min(top, H - ph - 6));

    popupEl.style.left = left + 'px';
    popupEl.style.top = top + 'px';
  }
})();
</script>
</body>
</html>
